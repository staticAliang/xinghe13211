<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>五行竞猜配置</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> 
    <link rel="stylesheet" th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" />
    <style type="text/css">
    	input::-webkit-outer-spin-button,
	    input::-webkit-inner-spin-button {
	        -webkit-appearance: none;
	    }
	    input[type="number"]{
	        -moz-appearance: textfield;
	    }
    </style>
</head>

<body>
	<div class="layui-form" style="width: 90%; margin-top: 31px;"
		lay-filter="showForm">
  		<div class="layui-form-item">
		    <label class="layui-form-label">金额</label>
		    <div class="layui-input-block">
		    	<input type="number" name="maxMoney" class="layui-input">
		    </div>
  		</div>
  		<div class="layui-form-item">
		    <label class="layui-form-label">次数</label>
		    <div class="layui-input-block">
		    	<input type="number" name="maxCount" class="layui-input">
		    </div>
  		</div>
  		<div class="layui-form-item">
		    <label class="layui-form-label">五行概率</label>
		    <div class="layui-input-block">
		    	<input type="number" name="n5" class="layui-input">
		    </div>
  		</div>
  		<div class="layui-form-item">
		    <label class="layui-form-label">生肖概率</label>
		    <div class="layui-input-block">
		    	<input type="number" name="n60" class="layui-input">
		    </div>
  		</div>
  		<div class="layui-form-item">
			<label class="layui-form-label">类型</label>
			<div class="layui-input-inline">
				<select name="type">
					<option value='金钱'>金钱</option>
					<option value='金元宝'>金元宝</option>
					<option value='积分'>积分</option>
				</select>
				<div class="layui-form-mid layui-word-aux">玩家提取和消耗类型</div>
			</div>
		</div>
  		<div class="layui-form-item">
		    <label class="layui-form-label">状态</label>
		    <div class="layui-input-block">
		      <input type="checkbox" name="status" lay-skin="switch" lay-text="开启|关闭" value="1">
		    </div>
  		</div>
		
		<div class="layui-form-item">
			<a class="layui-btn layui-btn-danger layui-btn" style="margin-left: 109px;" id="save">保存</a>
		</div>
		</div>
		<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
		<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
		<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
		<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		layui.use(['layer','table','form','util', "laydate"], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	var laydate = layui.laydate;
		  	//加载信息
		  	$.post(path+"/ws/configInfo/getOneConfigInfoData",{"keyName":"wuxing_config"},function(data){
		  		if(data.status == 200) {
		  			var config = data.data;
		  			var configJson = JSON.parse(config.data);
		  			form.val("showForm",{
		  				"maxMoney":configJson.maxMoney,
		  				"maxCount":configJson.maxCount,
		  				"n5":configJson.n5,
		  				"n60":configJson.n60,
		  				"type":configJson.type,
		  				"status":configJson.status
		  			})
		  		}
		  	})
		  	$(document).keydown(function(e) {
			    var key = undefined;
			    var possible = [ e.key, e.keyIdentifier, e.keyCode, e.which ];
			    while (key === undefined && possible.length > 0) {
			        key = possible.pop();
			    }
			    if (key && (key == '115' || key == '83' ) && (e.ctrlKey || e.metaKey) && !(e.altKey)){
			        e.preventDefault();
			        save();
			        return false;
			    }
			    return true;
			}); 
			$(document).on("click","#save",function(){
				save();
		  	})
		  	function save(){
				var da = form.val("showForm");
				if(da.type == "金钱" && da.maxMoney>30000000) {
					layer.msg("金钱最大3000万");
					da.maxMoney = 30000000;
					$("input[name='maxMoney']").val(30000000);
				}else if(da.type == "积分" && da.maxMoney>60000) {
					layer.msg("积分最大60000");
					da.maxMoney = 60000;
					$("input[name='maxMoney']").val(60000);
				}else if(da.type == "金元宝" && da.maxMoney>30000000) {
					layer.msg("金元宝最大3000万");
					da.maxMoney = 30000000;
					$("input[name='maxMoney']").val(30000000);
				}
				if(da.status == undefined) {
					da.status = 0;
				}
				if(da.n5 > 100) {
					layer.msg("五行概率最大100");
					return;
				}
				if(da.n60 > 100) {
					layer.msg("生肖概率最大100");
					return;
				}
		  		var load = $.load("正在保存...");
	  			$.post(path+"/ws/configInfo/updateConfigInfoByUUID2",{"uuid":"wuxing_config","data":JSON.stringify(da)},function(data){
	  				if(data.status == 200) {
	  					layer.msg("修改成功");
	  				}
	  				layer.close(load);
	  			})
			}
		});
	</script>
</body>

</html>
