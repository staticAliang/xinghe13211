<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<div class="example">
						<blockquote class="layui-elem-quote news_search layui-form">
							<!-- <div class="layui-inline">

							</div>

						<table id="table" lay-filter="test">

					<!-- End Example Events -->

		</div>
		<!-- End Panel Other -->
	</div>

		<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var layer;
		var table;
		var params;
		var util;
		var mapId;
		var ps = $.getQueryString("ps");
		var path = '[[${session.path}]]';
		layui.use(['layer','table','form','util'], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	var cols =  [
				{
					title: '名称',
					field: 'name'
				},
				{
					title: '等级',
					field: 'level'
				},
				{
					title: '门派',
					field: 'polar',
					templet:function(value){
						if(value.polar == 1) {
							return "金";
						}
						if(value.polar == 2) {
							return "木";
						}
						if(value.polar == 3) {
							return "水";
						}
						if(value.polar == 4) {
							return "火";
						}
						return "土";
					}
				},
				{
					title: '线路',
					field: 'serverName',
					width:400
				},
				{
					title: '剩余时间(秒)',
					field: 'time'
				},
			];
		  	var pageNum = 1;
		  	params = $.myRendar({"table":table,"elem":"#table","url":path+"/zuolao/getZuoLaoInfo","method":"post","cols":cols,toolbar:false,width:150,
				width:150,
				page:false,
				where:{"name":""}
				,templet:function(data){
					var html = '<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="release" data-type="'+data.task_type+'">释放</a>';
					return html;
				}
		  	});
		  	table.on('tool(test)', function(obj){
			  	var data = obj.data;
			  	var layEvent = obj.event;
			  	var t = $(this);
			  	var obj2 = {};
		 		if(layEvent == "release") {
					 layer.confirm('确定释放该人员吗？',function(){
						  obj2.name = data.name;
						  u(obj2,obj)
					 })
				 }
			});
		  	function u(obj,o) {
		  		 $.post(path+"/zuolao/zuoLaoRelease",obj,function(d){
				  		if(d.status == 200) {
							layer.msg("操作成功");
							o.del();
						}else {
							layer.msg(d.retmsg);
						}
				  });
		  	}
		  	//查询
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"name":name};
				}else {
					params.options.where = {};
				}
				table.render(params.options);
			})
		});
	</script>
</body>
