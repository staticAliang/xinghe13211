<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>帮派管理</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> 
	<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
<link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">
     <style>
    	.openMaxImg:hover{
   		    box-shadow: 0px 0px 4px 1px #4e4e4e;
   		    cursor: pointer;
    	}
    	/* 偶数行背景色 */
		.layui-table[lay-even] tr:nth-child(even) {
		    /* background-color: #aaffaa; */
		    background-color: #eeffee;
		}
		
		/* 鼠标指向表格时,奇数行背景颜色 */
		.layui-table tbody tr:hover,.layui-table-hover {
		    background-color: #eeffee;
		}
		/* 表格头部工具栏背景色 */
		.layui-table-tool {
		    background-color: #eeffee;
		}
		.news_search{
			font-size:14px;
		}
		.layui-form-label{
			padding: 9px 0;
		    left: 18px;
		    color: black;
		    font-size: 15px;
		    top: 1px;
	        width: 35px;
		}
		.layui-form-select {
		    max-width:12.5rem;
		}
		input::-webkit-outer-spin-button,
	    input::-webkit-inner-spin-button {
	        -webkit-appearance: none;
	    }
	    input[type="number"]{
	        -moz-appearance: textfield;
	    }
	    .layui-icon{
	    	height: 30px;
	    }
    </style>
</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<div class="example">
						<blockquote class="layui-elem-quote news_search">
							<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="名字"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
						</blockquote>
						<table id="table" lay-filter="test">
							
						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

			<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path2 = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		var mapId;
		var path = path2+"/party"
		
		layui.use(['layer','table','form','util'], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	layer.config({
				skin: 'layer-skin'
			})
		  	var cols =  [
				{
					title: 'id',
					field: 'id'
				}, 
				{
					title: '名称',
					field: 'partyName'
				},
				{
					title: '建设度',
					field: 'construct'
				},
				{
					title: '资金',
					field: 'money',
					edit:"text"
				},
				{
					title: '创建人',
					field: 'creator'
				},
				{
					title: '人数',
					field: 'population'
				},
				{
					title:"等级",
					templet:function(value){
						if(value.partyLevel == 1) {
							return "初级";
						}else if(value.partyLevel == 2) {
							return "中级";
						}else if(value.partyLevel == 3) {
							return "高级";
						}else if(value.partyLevel == 4) {
							return "顶级";
						}
						return "";
					}
				},
				{
					title: '自定义图标',
					templet: function(value) {
						var img = new Image();
						img.src= path2+'/party/getPartyIcon?partyId='+value.partyId;
						if(img.fileSize > 0 || (img.width > 0 && img.height > 0)){
							return "<img style='max-width:20px;' src="+path2+"'/party/getPartyIcon?partyId="+value.partyId+"'/>&nbsp;&nbsp;<a class='layui-btn layui-btn-danger layui-btn-xs clearIcon'  data-id="+value.partyId+">清除</a>";
						}
						return "";
					}
				},
				{
					title: '领导',
					templet: function(value) {
						var leaderJson = JSON.parse(value.leader);
						var h = "";
						$(leaderJson).each(function(i,o){
							if(o.job == "帮主") {
								h+="帮主:"+o.name;
							}
							if(o.job == "副帮主") {
								h+="副帮主:"+o.name;
							}
						})
						return h;
					}
				},
				{
					title: '创建时间',
					templet: function(value) {
						if(value.createTime != undefined){
							return util.toDateString(value.createTime,"yyyy-MM-dd");
						}else {
							return "";
						}
					}
				}
			];
		  	var pageNum = 1;
		  	params = $.myRendar({"table":table,"elem":"#table","url":path+"/getPartys","method":"post","cols":cols,toolbar:false,width:150,
				width:200,templet:function(data){
					var html = '<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="show" data-id="'+data.partyId+'">查看成员</a>';
					if(data.state == 0) {
						html+='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del" data-id="'+data.partyId+'">封停</a>';
					}else {
						html+='<a class="layui-btn layui-btn-wring layui-btn-xs" lay-event="cancel" data-id="'+data.partyId+'">恢复</a>';
					}
					html+='<a class="layui-btn layui-btn-wring layui-btn-xs" lay-event="update" data-id="'+data.partyId+'">修改</a>';
					return html;
				},success:function(res,curr,count){
					pageNum = curr;
			  	}
		  	});
		  	table.on('tool(test)', function(obj){
			  	var data = obj.data;
			  	var layEvent = obj.event;
			  	var t = $(this);
			  	var obj = {};
		 		if(layEvent == "del") {
					  layer.confirm('是否封停?',function(){
						  obj.partyId = data.partyId;
						  obj.state = 1;
						  u(obj)
					  })
				  }else if(layEvent == "cancel") {
					  obj.partyId = data.partyId;
					  obj.state = 0;
					  u(obj)
				  }else if(layEvent == "show") {
					  layer.open({
						  title:"[<font color='red'>"+data.partyName+"</font>]帮派成员",
						  type:2,
						  area:["80%","80%"],
						  content:path2+"/sys/partyMember?ps="+data.partyId
					  })
				  }else if(layEvent == "update") {
				  		var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="partyForm">';
						html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 70px; ">建设度</label> <div class="layui-input-block"> <input type="number" name="construct" class="layui-input" value="'+data.construct+'"> <input type="hidden" name="partyId" class="layui-input" value="'+data.partyId+'"></div></div>';
						html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 70px; ">资金</label> <div class="layui-input-block"> <input type="number" name="money" class="layui-input" value="'+data.money+'"> </div></div>';
						//等级
						html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width:70px;">等级</label> <div class="layui-input-block">';
						html += "<select name='partyLevel' class='extPosition'>";
						html += "<option value='1'>初级</option>";
						html += "<option value='2'>中级</option>";
						html += "<option value='3'>高级</option>";
						html += "<option value='4'>顶级</option>";
						html +="</select>";
						html+='</div></div>';
						
						html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" lay-submit style="margin-left: 109px;" id="updateForm">保存</a></div>'
						html += '</div>';
						layer.open({
							title: false,
							area: ["400px","350px"],
							type: 1,
							shadeClose:true,
							content: html,
							success: function() {
								$(".extPosition").find("option").each(function(i,o){
									var op = $(o);
									if(op.val() == data.partyLevel) {
										op.attr("selected","selected")
									}
								})
								form.render('select');
							}
						});
				  }
			});
		  	
		  	$(document).on("click",".clearIcon",function(){
		  		var t = $(this);
		  		u({"heir":"clearIcon","partyId":t.attr("data-id")});
		  	})
		  	$(document).on("click","#updateForm",function(){
		  		var f = form.val("partyForm");
		  		u(f);
		  	})
		  	
		  	
		  	function u(obj) {
		  		 $.post(path+"/updateParty",obj,function(d){
				  		if(d.status == 200) {
							layer.msg("操作成功");
							setTimeout(function(){
								params.options.page.curr = pageNum
								table.render(params.options)
							},500)
						}else {
							layer.msg(d.retmsg);
						}
				  });
		  	}
		  	//查询
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"partyName":name};
				}else {
					params.options.where = {};
				}
				table.render(params.options);
			})
		});
	</script>
</body>

</html>
