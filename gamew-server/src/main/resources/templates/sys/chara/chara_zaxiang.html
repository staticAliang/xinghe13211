<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>角色杂项</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> 
	<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
<link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">

     <style>
    	.openMaxImg:hover{
   		    box-shadow: 0px 0px 4px 1px #4e4e4e;
   		    cursor: pointer;
    	}
		
		/* 鼠标指向表格时,奇数行背景颜色 */
		.layui-table tbody tr:hover,.layui-table-hover {
		    background-color: #eeffee;
		}
		/* 表格头部工具栏背景色 */
		.layui-table-tool {
		    background-color: #eeffee;
		}
		.news_search{
			font-size:14px;
		}
		.layui-form-label{
			padding: 9px 0;
		    left: 18px;
		    color: black;
		    font-size: 15px;
		    top: 1px;
	        width: 35px;
		}
		.layui-form-select {
		    max-width:12.5rem;
		}
		input::-webkit-outer-spin-button,
	    input::-webkit-inner-spin-button {
	        -webkit-appearance: none;
	    }
	    input[type="number"]{
	        -moz-appearance: textfield;
	    }
	    .layui-icon{
	    	height: 30px;
	    }
    </style>
</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<div class="example">
						<blockquote class="layui-elem-quote news_search">
							<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="账号名"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
						</blockquote>
						<table id="table" lay-filter="test">
							
						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

		<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path2 = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		var mapId;
		var path = path2+"/account";
		
		layui.use(['layer','table','form','util'], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	var cols =  [
				{
					title: '角色',
					field: 'name'
				}
				,{
					title:"状态",
					field:"onLine",
					templet: function(value) {
						if(value.onLine == "在线") {
							return "<font color='#009688'>在线</font>";
						}
						return value.onLine;
					}
				},
				{
					title:"查看任务",
					templet: function(value) {
						return '<a class="layui-btn layui-btn-wring layui-btn-xs" lay-event="showTask" data-id="'+value.uuid+'">查看</a>';			
					}
				}
				,
				{
					title:"查看背包",
					templet: function(value) {
						return '<a class="layui-btn layui-btn-wring layui-btn-xs" lay-event="showBack" data-id="'+value.uuid+'">查看</a>';		
					}
				},
				{
					title:"查看宠物",
					templet: function(value) {
						return '<a class="layui-btn layui-btn-wring layui-btn-xs" lay-event="showPet" data-id="'+value.uuid+'">查看</a>';		
					}
				}
			];
		  	var pageNum = 1;
		  	params = $.myRendar({"table":table,"elem":"#table","url":path2+"/sys/wd/getOnLineUsers","method":"post","cols":cols,
		  		toolbar:false,width:150,
		  		where:{"flag":2},
		  		success:function(res,curr,count){
					pageNum = curr;
			  	}
		  	});
		  	table.on('tool(test)', function(obj){
			  	var data = obj.data;
			  	var layEvent = obj.event;
			  	var t = $(this);
			  	var obj = {};
		 		if(layEvent == "del") {
					  layer.confirm('是否封停?',function(){
						  obj.id = data.id;
						  obj.state = 1;
						  u(obj)
					  })
				  }else if(layEvent == "showTask") {
					  layer.open({
						  title:"查看[<font color='red'>"+data.name+"</font>]所有进行中的任务",
						  type:2,
						  area:["80%","80%"],
						  content:path2+"/sys/jump?page=/chara/chara_task.html&ps="+data.uuid
					  })
				  }
				  else if(layEvent == "showBack") {
					  layer.open({
						  title:"查看[<font color='red'>"+data.name+"</font>]背包",
						  type:2,
						  area:["80%","80%"],
						  content:path2+"/sys/jump?page=/chara/chara_back.html&ps="+data.uuid
					  })
				  }else if(layEvent == "showPet") {
					  var open = layer.open({
						  title:"查看[<font color='red'>"+data.name+"</font>]所有宠物",
						  type:2,
						  area:["80%","80%"],
						  content:path2+"/sys/jump?page=/chara/chara_pet.html&ps="+data.uuid
					  })
					  layer.full(open);
				  }
				 
			});
		  	function u(obj) {
		  		 $.post(path+"/accountDisableAndEnable",obj,function(d){
				  		if(d.status == 200) {
							layer.msg("操作成功");
							setTimeout(function(){
								params.options.page.curr = pageNum
								table.render(params.options)
							},500)
						}else {
							layer.msg(d.retmsg);
						}
				  });
		  	}
		  	//查询
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"name":name};
				}else {
					params.options.where = {};
				}
				table.render(params.options);
			})
		});
	</script>
</body>

</html>
