<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<div class="example">
						<table id="table" lay-filter="test">
							
						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

			<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var bili = [[${session.bili}]];
		var layer;
		var table;
		var params;
		var util;
		var showHtml=$("#user_detils").html();
		layui.use(['layer','table','form', 'laydate','util'], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	var date = layui.laydate;
		  	var type = -1;
		  	form = layui.form;
		  	form.on('select(type)', function (data) {
		  		type = data.value;
		  	});
		  	date.render({ 
		  	  elem: '#orderTime'
		  	  ,range: "~"
		  	});
		  	var cols =  [
				{
					title: 'id',
					field: 'id'
				}, 
				{
					title: '账户',
					field: 'name'
				},
				{
					title: '充值积分',
					field: 'chargeScore',
				},
				{
					title: '邀请码',
					field: 'yaoqingma',
					templet:function(value){
						
						return value.yaoqingma.toUpperCase();
					}
				},
				{
					title: 'ip地址',
					field: 'ip'
				},
				{
					title: '注册时间',
					field: 'addTime',
					templet: function(value) {
						if(value.addTime != undefined){
							return util.timeAgo(value.addTime);
						}else {
							return "";
						}
					}
				}
			];
		  	params = $.myRendar({"table":table,"elem":"#table","url":path+"/api/accounts/getAccounts","method":"post","cols":cols,toolbar:false});
			$(document).on("click",".query_btn",function(e){
				var account = $("#account");
				var orderTime = $("#orderTime");
				var where = {};
				
				var orderTime = $("#orderTime");
				if(orderTime.val() != "" && orderTime.val().length > 0) {
					where.createTime = orderTime.val();
				}
				if(account.val() != "" && account.val().length > 0) {
					where.accountname = account.val();
				}
				
				if(JSON.stringify(where) != "{}") {
					params.options.where = where;
				}else {
					params.options.where = "";				
				}
				table.render(params.options);
			});
		});
	</script>
</body>

</html>
