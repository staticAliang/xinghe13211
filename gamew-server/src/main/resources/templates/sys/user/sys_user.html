<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>npc列表2</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> 
	<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
<link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">
     <style>
    	.openMaxImg:hover{
   		    box-shadow: 0px 0px 4px 1px #4e4e4e;
   		    cursor: pointer;
    	}
    	/* 偶数行背景色 */
		.layui-table[lay-even] tr:nth-child(even) {
		    /* background-color: #aaffaa; */
		    background-color: #eeffee;
		}
		
		/* 鼠标指向表格时,奇数行背景颜色 */
		.layui-table tbody tr:hover,.layui-table-hover {
		    background-color: #eeffee;
		}
		/* 表格头部工具栏背景色 */
		.layui-table-tool {
		    background-color: #eeffee;
		}
		.news_search{
			font-size:14px;
		}
		.layui-form-label{
			padding: 9px 0;
		    left: 18px;
		    color: black;
		    font-size: 15px;
		    top: 1px;
	        width: 35px;
		}
		.layui-form-select {
		    max-width:12.5rem;
		}
		input::-webkit-outer-spin-button,
	    input::-webkit-inner-spin-button {
	        -webkit-appearance: none;
	    }
	    input[type="number"]{
	        -moz-appearance: textfield;
	    }
	    .layui-icon{
	    	height: 30px;
	    }
    </style>
</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<div class="example">
						<blockquote class="layui-elem-quote news_search">
							<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="用户名"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
						<div class="layui-inline">
						    <a class="layui-btn search_btn_cl addNpc">添加</a>
						</div>
						</blockquote>
						<table id="table" lay-filter="test">
							
						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

			<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var userType = '[[${session.user.userType}]]';
		var layer;
		var table;
		var params;
		var util;
		var mapId;
		
		layui.use(['layer','table','form','util'], function(){
			if(userType != 0) {
				$("body").html("无权访问");
			}
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	var cols =  [
				{
					title: 'id',
					field: 'id'
				}, 
				{
					title: '用户名',
					field: 'userName'
				},
				{
					title: '昵称',
					field: 'nickName'
				},
				{
					title: '用户类型',
					field: 'userType',
					templet: function(value) {
						if(value.userType == 0) {
							return "超级管理员";
						}
						return "普通管理员";
					}
				},
				{
					title:"最后登录ip",
					field:"lastLoginIp",
				},
				{
					title: '最后登录时间',
					field: 'lastLoginTime',
					templet: function(value) {
						if(value.lastLoginTime != undefined){
							return util.toDateString(value.lastLoginTime,"yyyy-MM-dd HH:mm:ss");
						}else {
							return "";
						}
					}
				},
				{
					title:"ip白名单",
					field:"allowLoginIp",
				}
			];
		  	var pageNum = 1;
		  	params = $.myRendar({"table":table,"elem":"#table","url":path+"/sys/user/getSysUsers","method":"post",where:{"name":""},"cols":cols,toolbar:false,
				templet:function(data){
					var html ='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="restPassword" data-id="'+data.id+'">重置密码</a>';
					html += '<a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="edit" data-id="'+data.id+'">修改</a>';
					if(data.userType != 0) {
						html+='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del" data-id="'+data.id+'">删除</a>';
					}
					return html;
				},success:function(res,curr,count){
					pageNum = curr;
			  	}
		  	});

		  	table.on('tool(test)', function(objd){
				  var data = objd.data;
				  var layEvent = objd.event;
				  var t = $(this);
				  var obj = {};
				  for(var p in data){
					  if(p != "updateTime" && p != "addTime") {
						  obj[p] = data[p];
					  }
					}
				  if(layEvent == "edit") {
					  var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="editForm">';
						html += '<div class="layui-form-item"> <label class="layui-form-label">ip白名单</label> <div class="layui-input-block"> <textarea width="200" name="ip" class="layui-textarea" lay-verify="required">'+data.allowLoginIp+'</textarea><div class="layui-form-mid layui-word-aux">多个ip请用、符号分开</div></div></div>';
						html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" style="margin-left: 109px;" id="updateNpcForm" lay-filter="addNpcForm" lay-submit data-id="'+data.id+'">保存</a></div>'
						html += '</div>';
						layer.open({
							title: false,
							area: ["600px","250px"],
							type: 1,
							shadeClose:true,
							content: html,
							success: function() {
								form.render('select');
							}
						});
				  }else if(layEvent == "del") {
					  layer.confirm('是否确定删除',function(){
						  $.post(path+"/sys/user/delSysUser", {"id":data.id},function(d){
							  if(d.status == 200) {
								  layer.msg("删除成功");
								  objd.del();
							  }else {
								  layer.msg(d.retmsg);
							  }
						  });
					  })
				  }else if(layEvent == "restPassword") {
					  layer.confirm('是否确定重置密码',function(){
						  $.post(path+"/sys/user/resetPassword", {"id":data.id},function(d){
							  if(d.status == 200) {
								  layer.msg("重置成功");
							  }else {
								  layer.msg(d.retmsg);
							  }
						  });
					  })
				  }
			});
		  	$(document).on("click","#updateNpcForm",function(){
		  		var npc = form.val("editForm");
		  		npc.id = $(this).attr("data-id");
		  		u(npc);
		  	})
		  	$(".addNpc").click(function(){
		  		var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="addNpcForm">';
						html += '<div class="layui-form-item"> <label class="layui-form-label">用户名</label> <div class="layui-input-block"> <input type="text" name="userName" class="layui-input" lay-verify="required" autocomplete="off"> </div></div>';
						
						html += '<div class="layui-form-item"> <label class="layui-form-label">昵称</label> <div class="layui-input-block"> <input type="text" name="nickName" class="layui-input" lay-verify="required" autocomplete="off"> </div></div>';
						html += '<div class="layui-form-item"> <label class="layui-form-label">ip白名单</label> <div class="layui-input-block"> <textarea width="200" name="allowLoginIp" class="layui-textarea" lay-verify="required" autocomplete="off"> </textarea><div class="layui-form-mid layui-word-aux">多个ip请用、符号分开</div></div></div>';
						html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" style="margin-left: 109px;" id="addNpcForm" lay-filter="addNpcForm" lay-submit>保存</a></div>'
						html += '</div>';
						layer.open({
							title: false,
							area: ["600px","500px"],
							type: 1,
							shadeClose:true,
							content: html,
							success: function() {
								form.render('select');
							}
					});
		  	})
		  	
		  	 form.on('submit(addNpcForm)', function(data){
			    $.load("正在添加...");
		  		var npc = form.val("addNpcForm");
		  		$.post(path+"/sys/user/addSysUser",npc,function(d){
				  		if(d.status == 200) {
							layer.msg("添加成功");
							setTimeout(function(){
								params.options.page.curr = pageNum
								table.render(params.options)
								
							},500)
						}else {
							layer.msg(d.retmsg);
						}
				  		layer.closeAll();
				  });
			    return false;
			  });
		  	function u(obj) {
		  		 $.post(path+"/sys/user/addAllowLoginIp",obj,function(d){
				  		if(d.status == 200) {
							layer.msg("操作成功");
							setTimeout(function(){
								params.options.page.curr = pageNum
								table.render(params.options)
							},500)
						}else {
							layer.msg(d.retmsg);
						}
				  });
		  	}
		  	//查询
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"username":name};
				}
				table.render(params.options);
			})
		});
	</script>
</body>

</html>
