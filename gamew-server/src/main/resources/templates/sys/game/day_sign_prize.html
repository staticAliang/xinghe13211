<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>每日签到</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> 
	<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
<link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">
     <style>
    	.openMaxImg:hover{
   		    box-shadow: 0px 0px 4px 1px #4e4e4e;
   		    cursor: pointer;
    	}
		
		/* 鼠标指向表格时,奇数行背景颜色 */
		.layui-table tbody tr:hover,.layui-table-hover {
		    background-color: #eeffee;
		}
		/* 表格头部工具栏背景色 */
		.layui-table-tool {
		    background-color: #eeffee;
		}
		.news_search{
			font-size:14px;
		}
		.layui-form-label{
			padding: 9px 0;
		    left: 18px;
		    color: black;
		    font-size: 15px;
		    top: 1px;
	        width: 35px;
		}
		.layui-form-select {
		    max-width:12.5rem;
		}
		input::-webkit-outer-spin-button,
	    input::-webkit-inner-spin-button {
	        -webkit-appearance: none;
	    }
	    input[type="number"]{
	        -moz-appearance: textfield;
	    }
	    .layui-icon{
	    	height: 30px;
	    }
    </style>
</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<div class="example">
						<blockquote class="layui-elem-quote news_search">
							<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="名字"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
					<!-- 	<div class="layui-inline">
						    <a class="layui-btn search_btn_cl addNpc">添加</a>
						</div> -->
						<div class="layui-inline">
							<a class="layui-btn layui-btn-danger" id="refreshCache">刷新缓存</a>
						</div>
						</blockquote>
						<table id="table" lay-filter="test">
							
						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

			<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		var mapId;
		
		layui.use(['layer','table','form','util'], function(){
		
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	var cols =  [
				{
					title: 'id',
					field: 'id'
				}, 
				{
					title: '名字',
					field: 'name'
				},
				{
					title:"某日",
					field: 'day'
				},
				{
					title:"类型",
					field: 'type'
				},
				{
					title:"数值",
					field: 'num'
				},
				{
					title: '状态',
					field: 'deleted',
					templet: function(value) {
						if(value.deleted){
							return "已删除";
						}else {
							return "正常";
						}
					}
				},
				
			];
		  	var pageNum = 1;
		  	params = $.myRendar({"table":table,"elem":"#table","url":path+"/sys/wd/daySignPrize/getDaySignPrizes","method":"post",where:{"name":""},"cols":cols,toolbar:false,
				templet:function(data){
					var html = '<a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="edit" data-id="'+data.id+'">修改</a>';
					return html;
				},success:function(res,curr,count){
					pageNum = curr;
			  	}
		  	});

		  	table.on('tool(test)', function(obj){
				  var data = obj.data;
				  var layEvent = obj.event;
				  var t = $(this);
				  var obj = {};
				  for(var p in data){
					  if(p != "updateTime" && p != "addTime") {
						  obj[p] = data[p];
					  }
					}
				  if(layEvent == "edit") {
						var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="npcForm">';
						html += '<div class="layui-form-item"> <label class="layui-form-label">名字</label> <div class="layui-input-block"> <input type="text" name="name" class="layui-input" value="'+data.name+'"> </div></div>';
						
						//类型
						html += '<div class="layui-form-item"> <label class="layui-form-label" style="width:33px">类型</label> <div class="layui-input-block">';
						html += "<select name='type' class='extPosition'>";
						html += "<option value='道具' selected='selected'>道具</option>";
						html += "<option value='银元宝'>银元宝</option>";
						html += "<option value='金元宝'>金元宝</option>";
						html += "<option value='变身卡'>变身卡</option>";
						html += "<option value='积分'>积分</option>";
						html += "<option value='潜能'>潜能</option>";
						html += "<option value='道行'>道行</option>";
						html += "<option value='经验' >经验</option>";
						html +="</select>";
						html+='</div></div>';
						
						html += '<div class="layui-form-item"> <label class="layui-form-label">某日</label> <div class="layui-input-block"> <input type="number" name="day" class="layui-input" value="'+data.day+'"> </div></div>';
						html += '<div class="layui-form-item"> <label class="layui-form-label">数值</label> <div class="layui-input-block"> <input type="number" name="num" class="layui-input" value="'+data.num+'"> </div><div class="layui-form-mid layui-word-aux">道具填1即可</div></div>';
						html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" lay-submit style="margin-left: 109px;" id="updateNpcForm" data-id="' + data.id + '">保存</a></div>'
						html += '</div>';
						layer.open({
							title: false,
							area: ["400px"],
							type: 1,
							shadeClose:true,
							content: html,
							success: function() {
								$(".extPosition").find("option").each(function(i,o){
									var op = $(o);
									if(op.text() == data.type.trim()) {
										op.attr("selected","selected")
									}
								})
								form.render('select');
							}
						});
				  }
			});
		  	$(document).on("click","#updateNpcForm",function(){
		  		var npc = form.val("npcForm");
		  		npc.id = $(this).attr("data-id");
		  		u(npc);
		  	})
		  	function u(obj) {
		  		 $.post(path+"/sys/wd/daySignPrize/update",obj,function(d){
				  		if(d.status == 200) {
							layer.msg("操作成功");
							params.options.page.curr = pageNum
							table.render(params.options)
						}else {
							layer.msg(d.retmsg);
						}
				  });
		  	}
		  	//查询
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"name":name};
				}else {
					params.options.where = {"name":""};
				}
				table.render(params.options);
			})
			$("#refreshCache").click(function(){
				$.post(path+"/sys/wd/daySignPrize/refreshCache",function(data){
					layer.msg(data.retmsg);
				})
			})
		});
	</script>
</body>

</html>
