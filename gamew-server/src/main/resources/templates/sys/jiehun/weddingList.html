<html>

<head>

    <meta charset="utf-8">

     <style>
    	.openMaxImg:hover{
   		    box-shadow: 0px 0px 4px 1px #4e4e4e;
   		    cursor: pointer;
    	}
    	/* 偶数行背景色 */

		    /* background-color: #aaffaa; */

			font-size:14px;

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<div class="example">
						<blockquote class="layui-elem-quote news_search">
							<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="名字"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
						<div class="layui-inline">
						    <a class="layui-btn layui-btn-warm config">配置</a>
						</div>
						</blockquote>
						<table id="table" lay-filter="test">
							
						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

			<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		var mapId;
		
		layui.use(['layer','table','form','util'], function(){
		
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	var cols =  [
				{
					title: 'id',
					field: 'id'
				}, 
				{
					title: '名字',
					field: 'name'
				},
				{
					title:"价格(点击修改)",
					field: 'price',
					edit:"text"
				},
				{
					title:"类型",
					field: 'type'
				},
				{
					title:"播放时间(秒)",
					field: 'playTime'
				}
			];
		  	var pageNum = 1;
		  	params = $.myRendar({"table":table,"elem":"#table","url":path+"/sys/wd/weedingList/getWeddingLists","method":"post","cols":cols,toolbar:false,page:false,
		  	});
		  
		  	//查询
		  	$(".config").click(function(){
		  		var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="editForm">';
				html += '<div class="layui-form-item" style="width:400px"> <label class="layui-form-label">消耗</label> <div class="layui-input-block">';
				html += "<select name='level' id='level'>";
				html +="<option value='金元宝'>金元宝</option>"
				html +="<option value='银元宝'>银元宝</option>"
				html +="<option value='积分'>积分</option>"
				html+="</select>";
				html+='</div></div>';
				
				html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" style="margin-left: 109px;" id="editFormBtn">保存</a></div>'
				html += '</div>';
				layer.open({
					title: false,
					area: ["400px","300px"],
					type: 1,
					shadeClose:true,
					content: html,
					success: function() {
						$.post(path+"/ws/configInfo/getConfigInfoDataByUUID",{"uuid":"marry_cost_type"},function(data){
							$("#level option[value='"+data.data.data+"']").attr("selected", true);								
							form.render('select');
							$("#editFormBtn").attr("data-id",data.data.id);
						})
					}
				});
			})
			$(document).on("click","#editFormBtn",function(){
				var d = form.val("editForm");
				var level = d.level;
				var id = $(this).attr("data-id");
				$.post(path+"/ws/configInfo/updateConfigInfoById",{"id":id,"data":level},function(data){
					if(data.status == 200) {
						layer.msg("修改成功");						
					}else {
						layer.msg(data.retmsg);
					}
				})
			})
		  	//查询
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"name":name};
				}else {
					params.options.where = {"name":""};
				}
				table.render(params.options);
			})
			
			table.on('edit(test)', function(obj){
				  var data = {"id":obj.data.id};
				  data[obj.field] = obj.value;
				  if(obj.field == "price"){
					  if(!isNum(obj.value)) {
						  layer.msg("请输入数字.");
						  return false;
					  }
			 	  }
				  $.post(path+"/sys/wd/weedingList/updateWeddingList",data,function(d){
					  if(d.status == 200) {
						  layer.msg("修改成功");
					  }else {
						  layer.msg(d.retmsg);
					  }
				  })
			});
		});
	</script>
</body>

</html>
