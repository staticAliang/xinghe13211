<body>
<div class="wrapper wrapper-content animated fadeInRight">

<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>

<script th:line="javascript">
	var path2 = '[[${session.path}]]';
	var layer;
	var table;
	var params;
	var util;
	var mapId;
	var path = path2+"/sys/wd/fudaichengwei"

	layui.use(['layer','table','form','util'], function(){
		util = layui.util;
		layer = layui.layer;
		table = layui.table;
		form = layui.form;
		var cols =  [
			{
				title: '编号',
				field: 'id'
			},
			{
				title: '名称',
				field: 'name'
			},
			{
				title: '次数',
				field: 'cishu'
			},
			{
				title: '类型',
				field: 'type'
			},
			{
				title: '备注',
				field: 'remake'
			}
		];
		var pageNum = 1;
		params = $.myRendar({"table":table,"elem":"#table","url":path+"/getChengweis","method":"post","cols":cols,toolbar:false,width:150,
			width:200,page:false
			,templet:function(data){
				var html = '<a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="edit" data-id="'+data.id+'">修改</a>';
				var html = html+'<a class="layui-btn layui-bg-blue layui-btn-xs" lay-event="del" data-id="'+data.id+'" data-attr="'+data.attri+'">删除</a>';
				return html;
			}
		});

		table.on('tool(test)', function(obj){
			var data = obj.data;
			var layEvent = obj.event;
			var t = $(this);
			var obj = {};
			if(layEvent == "del") {
				layer.confirm('是否删除?',function(){
					obj.id = data.id;
					var load = $.load();
					$.post(path+"/delChengwei",obj,function(data){
						if(data.status == 200) {
							layer.msg("删除成功");
							table.render(params.options);
						}else {
							layer.msg(data.retmsg);
						}
						layer.close(load);
					})
				})
			}else if(layEvent == "edit") {
				var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="editForm">';
				html += '<div class="layui-form-item"> <label class="layui-form-label">名称</label> <div class="layui-input-block"> <input type="text" name="name" class="layui-input" value="'+data.name+'" lay-verify="required" autocomplete="off"> <input type="hidden" value="'+data.id+'" name="id"/></div></div>';
				html += '<div class="layui-form-item"> <label class="layui-form-label">次数</label> <div class="layui-input-block"> <input type="text" name="cishu" class="layui-input" value="'+data.cishu+'" lay-verify="required" autocomplete="off"></div></div>';
				html += '<div class="layui-form-item"> <label class="layui-form-label">类型</label> <div class="layui-input-block"> <input type="text" name="type" class="layui-input" value="'+data.type+'" lay-verify="required" autocomplete="off"></div></div>';
				html += '<div class="layui-form-item"> <label class="layui-form-label">备注</label> <div class="layui-input-block"> <input type="text" name="remake" class="layui-input" value="'+data.remake+'" lay-verify="required" autocomplete="off"></div></div>';
				html+='</div>';
				html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" style="margin-left: 109px;" id="editFormBtn" data-id="' + data.id + '" lay-filter="editForm">保存</a></div>'
				html += '</div></div>';
				layer.open({
					title: false,
					area: ["500px","400px"],
					type: 1,
					shadeClose:true,
					content: html,
					success: function() {
						$("#level option[value='"+data.level+"']").attr("selected", true);
						form.render('select');
					}
				});
			}
		});


		$("#addChangeCard").click(function(data){
			var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="addChangeCardForm">';
			html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 70px; ">名称</label> <div class="layui-input-block"> <input type="text" name="name" class="layui-input" autocomplete="off"> </div></div>';
			html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 70px; ">类型</label> <div class="layui-input-block"> <input type="text" name="type" class="layui-input" autocomplete="off"> </div></div>';
			html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 70px; ">备注</label> <div class="layui-input-block"> <input type="text" name="remake" class="layui-input" autocomplete="off"> </div></div>';
			html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 70px; ">累计(开启福袋次数)</label> <div class="layui-input-block"> <input type="number" name="cishu" class="layui-input" autocomplete="off"> '+'</div></div>';
			//html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 70px; ">时间(分)</label> <div class="layui-input-block"> <input type="number" name="time" class="layui-input" value="0">  </div></div>';
			html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" lay-submit style="margin-left: 109px;" id="addChangeCardFormBtn">保存</a></div>'
			html += '</div>';
			layer.open({
				title: false,
				area: ["60%","95%"],
				type: 1,
				shadeClose:true,
				content: html,
				success:function(){
					form.render('select');
				}
			});
		});
		$(document).on("click","#addChangeCardFormBtn",function(){
			var da = form.val("addChangeCardForm");
			if(da.name == "" || da.name.length== 0){
				layer.msg("请输入名称");
			}else {
				var load= $.load("正在添加...");
				$.post(path+"/addChengwei",da,function(data){
					if(data.status == 200) {
						layer.msg("添加成功");
						table.render(params.options);
					}else {
						layer.msg(data.retmsg);
					}
					layer.close(load);
				})
			}
		})
		$(document).on("click","#addAttr",function(){
			var html = addAttriHtml();
			$("#attirbuteHtml").append(html);
			form.render('select');
		})
		$(document).on("click","#editFormBtn",function(){
			var editForm = form.val("editForm");
			var load = $.load();
			$.post(path+"/updateById",editForm,function(d){
				if(d.status == 200) {
					layer.msg("修改成功");
					params.options.page.curr = pageNum
					table.render(params.options);
				}else {
					layer.msg(d.retmsg);
				}
				layer.close(load);
			})
		})
		$(document).on("click",".delAttr",function(){
			var t = $(this);
			$("#"+t.attr("data-id")).remove();
		})
		function isRepeat(arr) {
			var hash = {};
			for(var i in arr) {
				if(hash[arr[i]]) {
					return true;
				}
				// 不存在该元素，则赋值为true，可以赋任意值，相应的修改if判断条件即可
				hash[arr[i]] = true;
			}
			return false;
		}
		function uuid() {
			var s = [];
			var hexDigits = "0123456789abcdef";
			for (var i = 0; i < 36; i++) {
				s[i] = hexDigits.substr(Math.floor(Math.random() * 0x10), 1);
			}
			s[14] = "4"; // bits 12-15 of the time_hi_and_version field to 0010
			s[19] = hexDigits.substr((s[19] & 0x3) | 0x8, 1); // bits 6-7 of the clock_seq_hi_and_reserved to 01
			s[8] = s[13] = s[18] = s[23] = "-";

			var uuid = s.join("");
			return uuid;
		}
		$("#refreshCache").click(function(){
			$.post(path+"/refreshCache",function(data){
				layer.msg(data.retmsg);
			})
		})
	});
</script>
