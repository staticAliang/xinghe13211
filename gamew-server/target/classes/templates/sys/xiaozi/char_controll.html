	<script th:line="javascript">
	var path = '[[${session.path}]]';
		var uuid = $.getQueryString("uuid");
		var isAll = $.getQueryString("isAll");
		layui.use(['layer','table','form','util'], function(){
			var form = layui.form;
			var table = layui.table;
			init();
			function init() {
				if(isAll != undefined) {
					return false;
				}
				$.post(path+"/wd/chara/getCharaValue",{"gid":uuid,"type":"xiaoziCharaInfo"},function(data){
					if(data.status == 200) {
						var chara = data.data.chara;
						var team = data.data.teams;
						if(team != undefined) {
							//有队伍
							$("#team").attr("data-team","1");
							$("#team").html("离队解散");
						}else {
							$("#team").attr("data-team","0");
							$("#team").html("创建队伍");
						}
						form.val("charaInfo",{
							x:chara.x,
							y:chara.y,
						});
						$(".autoTask").each(function(i,o){
							var t = $(o);
							if(t.attr("data-name")==chara.action) {
								t.text("停止");
								t.addClass("layui-btn-danger");
							}
						})
					}
				});
			}
			
			form.on('submit(*)', function(data){
				if($("#submit").attr("data-status") == 0) {
					layer.msg("获取数据中。");
				}else {
					var obj = data.field;
					obj.gid = uuid;
					obj.type = "updateCharaInfo";
					var load = $.load();
					$.post(path+"/wd/chara/updateValue",obj,function(data){
						layer.msg(data.retmsg);
						layer.close(load);
						init();
					})
				}
				return false;
			});
			form.on("switch(feisheng)",function(data){
				var sendObject = {};
				var obj = data.field;
				if(data.elem.checked) {
					sendObject.isFeisheng = 1;
				}else {
					sendObject.isFeisheng = 0;
				}
				sendObject.gid = uuid;
				sendObject.type = "updateCharaInfoToFeisheng";
				var load = $.load();
				$.post(path+"/wd/chara/updateValue",sendObject,function(data){
					layer.msg(data.retmsg);
					layer.close(load);
				})
			})
			$(document).on("click",".posBtn",function(){
				var value = $(this).attr("data");
				$.post(path+"/wd/xiaozi/wdXiaoZiOp",reqObj({"type":"posi","value":value,"uuid":uuid}),function(d){
					layer.msg(d.retmsg);
				});
			})
			$(document).on("click","#moveCharaXy",function(){
				var datas = form.val("charaInfo");
				if(datas.x == "" || datas.x.length == 0) {
					layer.msg("请输入x");
					return false;
				}else if(datas.y == "" || datas.y.length == 0) {
					layer.msg("请输入x");
					return false;
				}
				$.post(path+"/wd/xiaozi/wdXiaoZiOp",reqObj({"type":"move","x":datas.x,"y":datas.y,"uuid":uuid}),function(){
					layer.msg("操作成功！");
				});
			})
			
			
			$(document).keydown(function(event){
				if($("#fastEnter").text()=="关闭") {
					if (event.keyCode == 37) {
						move("left");
				    	return false;
				    }
				    if (event.keyCode == 38) {
					 	move("up");
				        return false;
				    }
				    if (event.keyCode == 39) {
					 	move("right");
				        return false;
				    }
				    if (event.keyCode == 40) {
						move("down");        
					 	return false;
			     	}
				}
			});
			
			function move(value){
				$.post(path+"/wd/xiaozi/wdXiaoZiOp",reqObj({"type":"posi","value":value,"uuid":uuid}),function(d){
					layer.msg(d.retmsg);
				});
			}
			$("#executeScript").click(function(){
				var datas = form.val("charaInfo");
				$.post(path+"/wd/xiaozi/wdXiaoZiOp",reqObj({"type":"script","value":datas.script,"uuid":uuid}),function(d){
			  		if(d.status == 200) {
						layer.msg("操作成功");
					}else {
						layer.msg(d.retmsg);
					}
			  	});
			})
			//说明
			$(".about").click(function(){
				var open = layer.open({
					title:"说明",
					type:2,
					area:["80%","80%"],
					maxmin:true,
					shade:false,
					moveOut:true,
					content:path+"/sys/jump?page=/xiaozi/wdxiaozi_script_about.html"
				})
			})
			//加入队伍
			$("#request_join").click(function(){
				if(isAll != undefined) {
					layer.msg("此操作不支持全局");
					return;
				}
				var datas = form.val("charaInfo");
				if(datas.request_join.length == 0 || datas.request_join == "") {
					layer.msg("请输入要加入队伍队长的名称");
					return;
				}
				$.post(path+"/wd/xiaozi/wdXiaoZiOp",{"type":"reqeust_join","value":datas.request_join,"uuid":uuid},function(d){
			  		if(d.status == 200) {
						layer.msg("操作成功");
					}else {
						layer.msg(d.retmsg);
					}
			  	});
			})
			
			$("#comment_send").click(function() {
				var datas = form.val("charaInfo");
				if(datas.msgContent==""|| datas.msgContent.length==0) {
					layer.msg("请输入内容");
				}else {
					$.post(path+"/wd/xiaozi/wdXiaoZiOp",reqObj({"type":"comment_send","value":datas.msgContent,"msgType":datas.msgType,"uuid":uuid}),function(d){
				  		if(d.status == 200) {
							layer.msg("发送成功");
						}else {
							layer.msg(d.retmsg);
						}
				  	});
				}
			})
			//创建队伍和离队
			$("#team").click(function() {
				var load = $.load();
				var status = $(this).attr("data-team");
				var type = "createTeam";
				if(status == 1) {
					//离队
					type = "jiesanTeam";
					$("#team").attr("data-team", 0);
					$("#team").html("创建队伍");
				}else {
					$("#team").attr("data-team", 1);
					$("#team").html("离队解散");
				}
				$.post(path+"/wd/xiaozi/wdXiaoZiOp",reqObj({"type":type,"value":status,"uuid":uuid}),function(d){
			  		if(d.status == 200) {
						layer.msg(d.retmsg);
					}else {
						layer.msg(d.retmsg);
					}
					layer.close(load);
			  	});
			})
			$("#fastEnter").click(function(){
				var status = $(this);
				if(status.text() == "开启") {
					status.text("关闭");
					layer.msg("键盘方向键已打开，上下左右可控制问道小子。");
				}else {
					status.text("开启");
					layer.msg("键盘方向键已关闭");
				}
			})
			$("#showAppliTeams").click(function(){
				if(isAll != undefined) {
					layer.msg("此操作不支持全局");
					return;
				}
				showApplyHtml();
			})
			function showApplyHtml() {
				//查看申请列表
				var obj = {"type":"showAppliTeams","uuid":uuid};
				var html = '<div style="width:95%;margin:0 auto"><table class="layui-table"> <thead><th>名称</th> <th>帮派</th> <th>操作</th> </thead> <tbody>';
				$.post(path+"/wd/xiaozi/wdXiaoZiOp",obj,function(d){
			  		if(d.status == 500) {
						layer.msg(d.retmsg);
						return;
					}
					$(d.data).each(function(i,o){
						html+='<tr id='+o.name+'><td>'+o.name+'</td><td>'+o.partyName+'</td><td><a class="layui-btn layui-btn-danger layui-btn-xs acceptJoin" data-name="'+o.name+'">同意</a><a class="layui-btn layui-btn-danger layui-btn-xs rejectJoin" data-name="'+o.name+'">拒绝</a></td></tr>';
					})
					html+='<tr><td colspan="3"><a class="layui-btn layui-btn-danger layui-btn-xs refreshJoin">刷新</a></td></tr></tbody> </table>';
					layer.open({
						title:"队伍申请列表",
						type:1,
						content:html,
						area:["500px","400px"],
						shadeClose:true
					})
			  	});
			}
			
			function reqop(obj) {

			function reqObj(obj) {

			//监听某个玩家的坐标
			var listCharaXyTimer;
			$("#listerChara").click(function(){
				var datas = form.val("charaInfo");
				if(datas.listerName == "" || datas.listerName.length ==0) {
					layer.msg("请输入玩家名称");
					return;
				}
				var t = $(this);
				if(t.text() == "开始") {
					t.text("停止");
					t.addClass("layui-btn-danger");
					//开始监听
					listerCharaXy(datas,t);
					listCharaXyTimer = window.setInterval(function() {
						listerCharaXy(datas,t);
					},1000);
				}else {
					if(listCharaXyTimer != undefined) {
						window.clearInterval(listCharaXyTimer) 
					}
					t.text("开始");
					t.removeClass("layui-btn-danger");
				}
			})
			function listerCharaXy(datas,t) {
				$.post(path+"/wd/xiaozi/wdXiaoZiOp",{"type":"listerChara","value":datas.listerName,"uuid":"useName", value:datas.listerName},function(d){
			  		if(d.status == 200) {
						$("#listerX").text(d.data.x);
				  		$("#listerY").text(d.data.y);
				  		$("input[name='mapName']").val(d.data.mapName);
			  		}else {
			  			if(listCharaXyTimer != undefined) {
							window.clearInterval(listCharaXyTimer) 
							t.text("开始");
							t.removeClass("layui-btn-danger");
							layer.msg(d.retmsg);
						}
			  		}
				});
			}

			//定时发送消息
			var commontTime;
			var time_comment_send_index = 0;
			$(document).on("click","#time_comment_send",function(){
				layer.prompt({
					  formType: 0,
					  title: '请输入定时时间(秒)',
					}, function(value, index, elem){
						$("#time_comment_send").attr("id","stopTime_comment_send");
						$("#stopTime_comment_send").text("停止定时");
						$("#stopTime_comment_send").addClass("layui-btn-danger");
						commontTime = window.setInterval(function() {
							var datas = form.val("charaInfo");
							if(datas.msgContent==""|| datas.msgContent.length==0) {
								layer.msg("请输入内容");
							}else {
								var cp = datas.msgContent.split("#I");
								if(time_comment_send_index == cp.length) {
									time_comment_send_index = 0; 
								}
								$.post(path+"/wd/xiaozi/wdXiaoZiOp",reqObj({"type":"comment_send","value":cp[time_comment_send_index],"msgType":datas.msgType,"uuid":uuid}),function(d){
									time_comment_send_index++;
								});
							}
						},parseInt(value)*1000);
					  	layer.close(index);
				});		
			})
			
			//停止循环执行脚本
			$(document).on("click","#stopTime_comment_send",function(){
				$("#stopTime_comment_send").attr("id","time_comment_send");
				$("#time_comment_send").text("定时消息");
				$("#time_comment_send").removeClass("layui-btn-danger");
				if(commontTime != undefined) {
					window.clearInterval(commontTime);
				}
			})
			
			//循环执行指令
			var excuteScriptIndex = 0;
			var excuteScriptTime;
			$(document).on("click","#timeExecuteScript",function(){
				layer.prompt({
					  formType: 0,
					  title: '请输入定时时间(秒)',
					}, function(value, index, elem){
						$("#timeExecuteScript").attr("id","stopTimeExecuteScript");
						$("#stopTimeExecuteScript").text("停止脚本");
						$("#stopTimeExecuteScript").addClass("layui-btn-danger");
						startExeceteTimeF();
						layer.msg("开始执行自动脚本");
						excuteScriptTime = window.setInterval(function() {
							try{
								startExeceteTimeF(parseInt(value)*1000);
							}catch(err) {
								layer.msg("脚本格式错误！");
							}
						},parseInt(value)*1000);
					  	layer.close(index);
				});
			})
			function startExeceteTimeF(timeValue) {
				var datas = form.val("charaInfo");
				if(datas.script==""|| datas.script.length==0) {
					layer.msg("请输入脚本");
				}else {
					//开始分割脚本
					var scriptStrs = datas.script.split("~");
					var autoScriptText = scriptStrs[0].split(",");
					 if(excuteScriptIndex == autoScriptText.length) {
						excuteScriptIndex = 0;
					}
					var autoScriptInfo;
					if(scriptStrs.length>1) {
						//如果有则取出加成信息
						var expScript = scriptStrs[1].split(",");
						//表示指定的经验
						if(expScript.length > 1) {
							if(expScript.length!=autoScriptText.length) {
								layer.msg("脚本格式错误！");
								return;
							}
							autoScriptInfo = expScript[excuteScriptIndex];
						}else {
							autoScriptInfo = expScript[0];
						}
					}
					execeteScriptTimeF(autoScriptText);
					setTimeout(function(){
						if(autoScriptInfo != undefined) {
							var autoScriptInfoArr = autoScriptInfo.split("=");
							//类型
							var autoScriptInfoType = autoScriptInfoArr[0]
							//具体数值
							var autoScriptInfoNum = autoScriptInfoArr[1];
							if(autoScriptInfoType == "exp") {
								var obj = {"uuid":uuid,"type":"exp","value":autoScriptInfoNum};
								if(isAll != undefined) {
									obj.sendAllChara = 1;
								}
								$.post(path+"/wd/xiaozi/sendCharInfo",obj,function(){
								})
							}
							console.log("执行加成")
						}
					},timeValue-(2*1000))
				}
			}
			
			function execeteScriptTimeF(scriptStrs) {
				$.post(path+"/wd/xiaozi/wdXiaoZiOp",reqObj({"type":"script","value":scriptStrs[excuteScriptIndex],"uuid":uuid,"executeType":"autoTimeScript"}),function(d){
					excuteScriptIndex++;
				});
			}
			
			//停止循环执行脚本
			$(document).on("click","#stopTimeExecuteScript",function(){
				$("#stopTimeExecuteScript").attr("id","timeExecuteScript");
				$("#timeExecuteScript").text("循环执行");
				$("#timeExecuteScript").removeClass("layui-btn-danger");
				if(excuteScriptTime != undefined) {
					window.clearInterval(excuteScriptTime);
				}
			})
		})
	</script>
