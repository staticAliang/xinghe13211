<body>

		<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>

		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		var mapId;
		var where = {};
		var  form;
		layui.use(['layer','table','form','util'], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	
		  	var cols = [{
				title: 'id',
				type: 'checkbox',
				templet: function(value) {
					return value.id;
				}
			},
			{
				title: '名字',
				field: 'keyName',
			},
			{
				title: 'uuid',
				field: 'uuid',
				width:300
			},
			{
				title: '别名',
				field: 'aliasName'
			}
		];
		var url = path+"/ws/configInfo";
		init();
		var params;
		function init() {
			params = $.myRendar({
				"table": table,
				"elem": "#users",
				"url": url+"/getConfigInfos",
				"method": "post",
				"cols": cols,
				toolbar: false,
				where:{"aliasName":"关于"},
				page: true,
				templet:function(data){
					var html  = "";
					html+='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="edit">修改</a>';
					html += '<a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="del" data="1">删除</a>';
					return html;
				}
			});
		}
		table.on('tool(users)', function(obj){
			  var data = obj.data;
			  var layEvent = obj.event;
			  var tr = obj.tr;
			  var type = "";
			  var value = $(this).attr("data");
			  var t = $(this);
			  if(layEvent == "del") {
				  layer.confirm("是否确认删除?",function(index){
					  //删除
					var load = $.load();
					$.post(url+"/delConfigInfoById",{"id":data.id},function(data){
						layer.msg("删除成功");
						obj.del();
						layer.close(load);
					})
					layer.close(index);
				  })
				
			  }else if(layEvent == "edit") {
				  var load = $.load();
				  $.post(url+"/getConfigInfoDataById",{"id":data.id},function(datas){
					    var json = json = format(datas.data.data,false);
					  	var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="editForm">';
						html += '<div class="layui-form-item"> <label class="layui-form-label">名字</label> <div class="layui-input-block"> <input type="text" name="keyName" class="layui-input" value="'+data.keyName+'"> </div></div>';
						html += '<div class="layui-form-item"> <label class="layui-form-label">数据</label> <div class="layui-input-block"> <textarea type="text" name="data" class="layui-textarea" style="height:500px"> '+json+'</textarea> </div></div>';
						html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn"  style="margin-left: 109px;" id="edit">保存</a><input type="hidden" name="id" class="layui-input" value="'+data.id+'"></div>'
						html += '</div>';
						layer.open({
							title: false,
							area: ["95%","95%"],
							type: 1,
							shadeClose:true,
							content: html,
							success: function() {
								layer.close(load);
							}
						});
				  })
			  }
		});
		
		  	function u(obj) {
		  		 $.post(path+"/updateParty",obj,function(d){
				  		if(d.status == 200) {
							layer.msg("操作成功");
							setTimeout(function(){
								params.options.page.curr = pageNum
								table.render(params.options)
							},500)
						}else {
							layer.msg(d.retmsg);
						}
				  });
		  	}
		  	//查询
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"keyName":name,"aliasName":"关于"};
				}else {
					params.options.where = {"aliasName":"关于"};
				}
				table.render(params.options);
			})
			$("#add").click(function() {
				var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="addform">';
				html += '<div class="layui-form-item"> <label class="layui-form-label">名字</label> <div class="layui-input-block"> <input type="text" name="keyName" class="layui-input"> </div></div>';
				html += '<div class="layui-form-item"> <label class="layui-form-label">数据</label> <div class="layui-input-block"> <textarea type="text" name="data" class="layui-textarea" style="height:500px" id="npcStatueData"> </textarea> </div></div>';
				html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" style="margin-left: 109px;" id="submit">保存</a></div>'
				html += '</div>';
				layer.open({
					title: false,
					area: ["95%","95%"],
					type: 1,
					shadeClose:true,
					content: html,
					success: function() {
						
					}
				});
			})
			function isJSON(str) {
		  	    if (typeof str == 'string') {
		  	        try {
		  	            var obj=JSON.parse(str);
		  	            if(typeof obj == 'object' && obj ){
		  	                return true;
		  	            }else{
		  	                return false;
		  	            }

		  	        } catch(e) {
		  	            console.log('error：'+str+'!!!'+e);
		  	            return false;
		  	        }
		  	    }
		  	}
		  	
		  	function format(txt, compress) {
		  	    var indentChar = '    ';
		  	    if (/^\s*$/.test(txt)) {
		  	        console.log('数据为空,无法格式化! ');
		  	        return;
		  	    }
		  	    try {
		  	        var data = eval('(' + txt + ')');
		  	    } catch (e) {
		  	        console.log('数据源语法错误,格式化失败! 错误信息: ' + e.description, 'err');
		  	        return txt;
		  	    }
		  	    var draw = [],
		  	        last = false,
		  	        This = this,
		  	        line = compress ? '' : '\n',
		  	        nodeCount = 0,
		  	        maxDepth = 0;

		  	    var notify = function (name, value, isLast, indent, formObj) {
		  	        nodeCount++; /*节点计数*/
		  	        for (var i = 0, tab = ''; i < indent; i++)
		  	            tab += indentChar; /* 缩进HTML */
		  	        tab = compress ? '' : tab; /*压缩模式忽略缩进*/
		  	        maxDepth = ++indent; /*缩进递增并记录*/
		  	        if (value && value.constructor == Array) {
		  	            /*处理数组*/
		  	            draw.push(
		  	                tab + (formObj ? '"' + name + '":' : '') + '[' + line
		  	            ); /*缩进'[' 然后换行*/
		  	            for (var i = 0; i < value.length; i++)
		  	                notify(i, value[i], i == value.length - 1, indent, false);
		  	            draw.push(
		  	                tab + ']' + (isLast ? line : ',' + line)
		  	            ); /*缩进']'换行,若非尾元素则添加逗号*/
		  	        } else if (value && typeof value == 'object') {
		  	            /*处理对象*/
		  	            draw.push(
		  	                tab + (formObj ? '"' + name + '":' : '') + '{' + line
		  	            ); /*缩进'{' 然后换行*/
		  	            var len = 0,
		  	                i = 0;
		  	            for (var key in value)
		  	                len++;
		  	            for (var key in value)
		  	                notify(key, value[key], ++i == len, indent, true);
		  	            draw.push(
		  	                tab + '}' + (isLast ? line : ',' + line)
		  	            ); /*缩进'}'换行,若非尾元素则添加逗号*/
		  	        } else {
		  	            if (typeof value == 'string') value = '"' + value + '"';
		  	            draw.push(
		  	                tab +
		  	                (formObj ? '"' + name + '":' : '') +
		  	                value +
		  	                (isLast ? '' : ',') +
		  	                line
		  	            );
		  	        }
		  	    };
		  	    var isLast = true,
		  	        indent = 0;
		  	    notify('', data, isLast, indent, false);
		  	    return draw.join('');
		  	}
			$(document).on("click","#submit",function(){
				var da = form.val("addform");
				da.aliasName = "关于";
				var load = $.load("正在保存");
				$.post(url+"/addConfigInfo",da,function(data){
					layer.msg("保存成功");			
					table.render(params.options);
					layer.closeAll();
				})
			})
			$(document).on("click","#edit",function(){
				var da = form.val("editForm");
				var load = $.load("正在保存");
				$.post(url+"/updateConfigInfoById",da,function(data){
					layer.msg("保存成功");					
					layer.closeAll();
					table.render(params.options);
				})
			})
			
		});
	</script>
