		<div class="layui-fluid">

	<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
	<script th:src="@{/static/sys/js/echats/echarts.min.js}"></script>

	<script type="text/javascript" th:line="javascript">
		var path = '[[${session.path}]]';
		layui.use(['element', 'carousel', 'table', "util", "form", "layer", "slider", "laydate"], function() {
			var e = layui.$;
			var layer = layui.layer;
			var laydate = layui.laydate;
			var util = layui.util;
			var form = layui.form;
			var table = layui.table;
			var element = layui.element;
			var carousel = layui.carousel;
			var slider = layui.slider;
			var myChartPie;
			var config ={};
			function load() {
				layer.load(2, {
					time: 10 * 1000
				});
			}
			$(".flush").click(function() {
				table.render(params.options)
			})

			function isRepeat(arr) {
				var hash = {};
				for(var i in arr) {
					if(hash[arr[i]]) {
						return true;
					}
					// 不存在该元素，则赋值为true，可以赋任意值，相应的修改if判断条件即可
					hash[arr[i]] = true;
				}
				return false;
			}

			function charNum(thisArr, arr) {
				var count = 0;
				for(var i = 0; i < arr.length; i++) {
					if(thisArr == arr[i]) {
						count++;
					}
				}
				return count;
			}
			loadConfig();

			function loadConfig() {
				//加载配置操作信息
				$.post(path+"/sys/wd/getTouDingChengHaoConfig",{"configName":"TouDingChengHao"}, function(data) {
					config.touDingChengHao = data.data;
					var chenghao = config.touDingChengHao.chenghao;

					form.val("chenghaoForm", {
					  "chenghao":data.data.chenghao,
					});
				})
			}

			function checkNum(val) {
				var reg = /^[0-9]+.?[0-9]*$/
				if(reg.test(val)) {
					return true
				}
				return false;
			}

			$("#chenghao").click(function() {
				layer.prompt({
					title: '头顶称号配置[名称:icon]',
					formType: 0,
					value: config.touDingChengHao.chenghao
				}, function(val, index) {
					//请求后端.
					var d = {
						"type": "chenghao",
						"value": val
					};
					shidaoSubmit(d);
					layer.close(index);
				});
			})

			function shidaoSubmit(d) {
				var load = $.load("请求中");
				$.post(path+"/sys/wd/touDingChengHaoSet", d, function(data) {
					if(data.status == 200) {
						loadConfig();
						layer.msg("操作成功");
						setTimeout(function() {
							layer.closeAll();
						}, 500)
					} else {
						layer.msg(data.retmsg);
					}
					layer.close(load);
				})
			}
		});
	</script>

</html>
