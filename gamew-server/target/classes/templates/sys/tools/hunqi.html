				});

				for(var i = 0; i < ary.length; i++) {
					if(yangKeyNum>2) {
						break;
					}
					yangKeyNum = 0;
					for(var j = i; j < ary.length; j++) {
						if(ary[i] == ary[j]) {
						  yangKeyNum++;
					  	}
					}
				}
				if(yangKeyNum>2) {
					layer.msg("阳属性最多只能2条重复属性");
					return;
				}
				
				//阴属性统计
				var ary2 = new Array();
				$(".yinKey").each(function(i,o){
					var sel = $(o).find("option:selected");
					if(sel.val() != "") {
						ary2.push(sel.text());
					}
				});
				var yinKeyNum = 0;
				for(var i = 0; i < ary2.length; i++) {
					if(yinKeyNum>2) {
						break;
					}
					yinKeyNum = 0;
					for(var j = i; j < ary2.length; j++) {
						if(ary2[i] == ary2[j]) {
						  yinKeyNum++;
					  	}
					}
				}
				if(yinKeyNum>2) {
					layer.msg("<font color='yellow'>阴</font>属性最多只能2条重复属性");
					return;
				}
				var charaName = window.parent.getCharaName();
				if(charaName == "") {
					layer.msg("请输入角色名");
					return;
				}
				data.charaName = charaName;
				$.post(path+"/wd/chara/sendHunQi",data,function(d){
					if(d.status == 200) {
						
					}
					layer.msg(d.retmsg);
				})
			});
		});
