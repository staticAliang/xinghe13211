<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>帮派成员</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> 
	<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
<link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">

     <style>
    	.openMaxImg:hover{
   		    box-shadow: 0px 0px 4px 1px #4e4e4e;
   		    cursor: pointer;
    	}
		
		/* 鼠标指向表格时,奇数行背景颜色 */
		.layui-table tbody tr:hover,.layui-table-hover {
		    background-color: #eeffee;
		}
		/* 表格头部工具栏背景色 */
		.layui-table-tool {
		    background-color: #eeffee;
		}
		.news_search{
			font-size:14px;
		}
		.layui-form-label{
			padding: 9px 0;
		    left: 18px;
		    color: black;
		    font-size: 15px;
		    top: 1px;
	        width: 35px;
		}
		.layui-form-select {
		    max-width:12.5rem;
		}
		input::-webkit-outer-spin-button,
	    input::-webkit-inner-spin-button {
	        -webkit-appearance: none;
	    }
	    input[type="number"]{
	        -moz-appearance: textfield;
	    }
	    .layui-icon{
	    	height: 30px;
	    }
    </style>
</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<div class="example">
						<blockquote class="layui-elem-quote news_search">
							<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="名字"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
						</blockquote>
						<table id="users" lay-filter="users">
							
						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

		<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		var mapId;
		var partyid = $.getQueryString("ps");
		layui.use(['layer','table','form','util'], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	
		  	var cols = [{
				title: 'id',
				type: 'checkbox',
				templet: function(value) {
					return value.id;
				}
			},
			{
				title: '角色名',
				field: 'name',
			},
			{
				title: '职位',
				templet:function(value){
					return value.job.split(":")[0];
				}
			},
			{
				title: '活跃度',
				field: 'active',
			},
			{
				title: '本周活跃度',
				field: 'currWeekActive',
			},
			{
				title: '上周活跃度',
				field: 'lastWeekActive',
			},
			{
				title: '门派',
				field: 'polar',
				templet: function(value) {
					var v = "土";
					if(value.polar == 1) {
						v = "金"
					} else if(value.polar == 2) {
						v = "木";
					} else if(value.polar == 3) {
						v = "水";
					} else if(value.polar == 4) {
						v = "火"
					}
					return v;
				},
				width: 60
			},
			{
				title: '离线时间',
				field: 'logoutTime',
				templet:function(value) {
					if(value.logoutTime != null) {
						return util.timeAgo(value.logoutTime, true);
					}
					return "";
				}
			},
			{
				title: '加入时间',
				field: 'createTime',
				templet:function(value) {
					if(value.createTime != null) {
						return util.timeAgo(value.createTime, true);
					}
					return "";
				}
			},
		];
		var url = path+"/party/getPartyMembers";
		init();
		var params;
		function init() {
			params = $.myRendar({
				"table": table,
				"elem": "#users",
				"url": url,
				"method": "post",
				"cols": cols,
				toolbar: false,
				page: true,
				width:250,
				where:{"partyId":partyid},
				success:function(res){
					$("#onlineNumber").text(res.data.onlines)
				}
			});
		}
		table.on('tool(users)', function(obj){
			  var data = obj.data;
			  var layEvent = obj.event;
			  var tr = obj.tr;
			  var type = "";
			  var value = $(this).attr("data");
			  var t = $(this);
			  if(layEvent == "disable") {
				  type = "disable";
			  }else if(layEvent == "del") {
				  //封号
				  type = "del";
			  }else if(layEvent == "down") {
				  //踢下线
				  type = "down";
			  }else if(layEvent == "restMonster") {
				  //
				  type = "restMonsterOne";
			  }
			  $.post(path+"/sys/wd/charOperations",{"type":type,"value":$(this).attr("data")==undefined?-1:$(this).attr("data"),"uuid":data.charaGid},function(d){
			  		if(d.status == 200) {
			  			if(layEvent == "disable") {
			  				//禁言
			  				if(value == 0) {
			  					t.attr("data","1");
			  					t.html("禁言");
			  				}else {
			  					t.attr("data","0");
			  					t.html("解禁言");
			  				}
						}else if(layEvent == "del") {
						 	 //封号
						 	if(value == 0) {
			  					t.attr("data","1");
			  					t.html("封号");
			  					t.removeClass("layui-btn-warm");
			  				}else {
			  					t.attr("data","0");
			  					t.html("解封");
			  					t.addClass("layui-btn-warm");
			  				}
						}
						layer.msg("操作成功");
					}else {
						layer.msg(data.retmsg);
					}
			  });
		});
		  	//查询
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"partyId":partyid,"name":name};
				}else {
					params.options.where = {};
				}
				table.render(params.options);
			})
		});
	</script>
</body>

</html>
