<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>元宝商城</title>
<meta name="keywords" content="">
<meta name="description" content="">

<link rel="shortcut icon" href="favicon.ico">
<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
<link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">
<style>
.openMaxImg:hover {
	box-shadow: 0px 0px 4px 1px #4e4e4e;
	cursor: pointer;
}


/* 鼠标指向表格时,奇数行背景颜色 */
.layui-table tbody tr:hover, .layui-table-hover {
	background-color: #eeffee;
}
/* 表格头部工具栏背景色 */
.layui-table-tool {
	background-color: #eeffee;
}

.news_search {
	font-size: 14px;
}

.layui-form-label {
	padding: 9px 0;
	left: 18px;
	color: black;
	font-size: 15px;
	top: 1px;
	width: 70px;
}

input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
	-webkit-appearance: none;
}

input[type="number"] {
	-moz-appearance: textfield;
}
</style>
</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<blockquote class="layui-elem-quote news_search">
						<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="商品名"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
							<a class="layui-btn" id="add">添加</a>
						</div>
						<div class="layui-inline">
							<a class="layui-btn layui-btn-danger" id="refreshCache">刷新缓存</a>
						</div>
					</blockquote>


					<!-- Example Events -->
					<div class="example">
						<table id="table" lay-filter="test">

						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

	<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
	<script th:line="javascript">
	var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		layui.use([ 'layer', 'table', 'form', 'laydate', 'util' ], function() {
			util = layui.util;
			layer = layui.layer;
			table = layui.table;
			var date = layui.laydate;
			form = layui.form;
			var cols = [ {
				title : 'id',
				field : 'id',
			}, {
				title : '名字',
				field : 'name',
			}, {
				title : '元宝',
				field : 'coin',
			}, {
				title : '条形码',
				field : 'barcode',
			}, 
			{
				title : '是否推荐',
				field : 'recommend',
				templet:function(value){
					if(value.recommend == 3) {
						return "<font color='red'>推荐</font>"
					}
					return "";
				}
			}, 
			{
				title : '元宝类型',
				field : 'forSale',
				templet:function(value){
					if(value.forSale == 1) {
						return "<font color='#CD7F32'>金元宝</font>"
					}else if(value.forSale == 2) {
						return "<font color='green'>通用</font>"
					}
					return "<font color='#E6E8FA'>银元宝</font>";
				}
			}, 
			{
				title : '显示位置',
				field : 'rpos',
			},
			{
				title : '会员购买',
				field : 'mustVip',
				templet:function(value){
					if(value.mustVip == 1) {
						return "<font color='red'>是</font>";
					}
					return "否";
				}
			},
			{
				title : '类型',
				field : 'type',
				templet:function(value){
					var html = "";
					if(value.type == 1) {
						html = "推荐商品"
					}else if(value.type ==2) {
						html = "提升道具"
					}else if(value.type ==3) {
						html = "练功道具";
					}else {
						html = "其他道具";
					}
					return html;
				}
			},
			{	
				title: '状态',
				field: 'deleted',
				templet: function(value) {
					if(value.deleted){
						return "下架";
					}else {
						return "上架";
					}
				}
			}
			];
			params = $.myRendar({
				"table" : table,
				"elem" : "#table",
				"url" : path+"/sys/wd/goods/getStoreGoods",
				"method" : "post",
				"cols" : cols,
				toolbar : false,
				width:"150",
				templet:function(data){
					var html = "";
					html+='<a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="edit" data-id="'+data.id+'">修改</a>'
					if(!data.deleted) {
						html+='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del" data-id="'+data.id+'" >下架</a>';
					}else {
						html+='<a class="layui-btn layui-btn-wring layui-btn-xs" lay-event="cancel" data-id="'+data.id+'">上架</a>';
					}
					return html;
				},
				success:function(c,curr) {
					pageNum = curr;
				}
			});
			
			
			$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"name":name};
				}else {
					params.options.where = {};
				}
				table.render(params.options);
			})
			table.on('tool(test)', function(obj){
				  var data = obj.data;
				  var layEvent = obj.event;
				  var t = $(this);
				  var obj = {};
				  if(layEvent == "del") {
					  layer.confirm("确定下架?",function(){
						  obj.id = data.id;
						  obj.deleted = true;
						  u(obj)
					  })
					  
				  }else if(layEvent == "cancel") {
					  layer.confirm("确定上架?",function(){
						  obj.id = data.id;
						  obj.deleted = false;
						  u(obj)
					  })
				  }else if(layEvent == "edit") {
					  var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="editForm">';
						html += '<div class="layui-form-item"> <label class="layui-form-label">名字</label> <div class="layui-input-block"> <input type="text" name="name" class="layui-input" value="'+data.name+'" lay-verify="required"> <input type="hidden" value="'+data.id+'" name="id"/></div></div>';
						html += '<div class="layui-form-item"> <label class="layui-form-label">元宝</label> <div class="layui-input-block"> <input type="number" name="coin" class="layui-input" value="'+data.coin+'" lay-verify="required"> </div></div>';
						html += '<div class="layui-form-item"> <label class="layui-form-label">条形码</label> <div class="layui-input-block"> <input type="text" name="barcode" class="layui-input" value="'+data.barcode+'" lay-verify="required"> </div></div>';
						html += '<div class="layui-form-item"> <label class="layui-form-label">位置</label> <div class="layui-input-block"> <input type="number" name="rpos" class="layui-input" value="'+data.rpos+'" lay-verify="required"> </div></div>';
						html += '<div class="layui-form-item"> <label class="layui-form-label">会员购买</label> <div class="layui-input-block">';
						html += "<select name='mustVip' lay-verify='required'>";
						if(data.mustVip ==0) {
							html +="<option value='0' selected>否</option>"
							html +="<option value='1'>是</option>"
						}else {
							html +="<option value='0'>否</option>"
								html +="<option value='1' selected>是</option>"
						}
						html+="</select>";
						html+='</div></div>';
						
						
						html += '<div class="layui-form-item" style="width:400px"> <label class="layui-form-label">类型</label> <div class="layui-input-block">';
						html += "<select name='type' id='type' lay-verify='required'>";
						html +="<option value='1'>推荐商品</option>"
						html +="<option value='2'>提升道具</option>"
						html +="<option value='3'>练功道具</option>"
						html +="<option value='4'>其他道具</option>"
						html+="</select>";
						html+='</div></div>';
						
						//是否推荐
						html += '<div class="layui-form-item"> <label class="layui-form-label">是否推荐</label> <div class="layui-input-block">';
						html += "<select name='recommend' lay-verify='required'>";
						if(data.recommend ==3) {
							html +="<option value='0'>否</option>"
							html +="<option value='3' selected>是</option>"
						}else {
							html +="<option value='0' selected>否</option>"
								html +="<option value='3'>是</option>"
						}
						html+="</select>";
						html+='</div></div>';
						
						//元宝类型
						html += '<div class="layui-form-item"> <label class="layui-form-label">元宝类型</label> <div class="layui-input-block">';
						html += "<select name='forSale' lay-verify='required'>";
						if(data.forSale == 1) {
							html +="<option value='0'>银元宝</option>"
							html +="<option value='1' selected>金元宝</option>"
							html +="<option value='2'>通用</option>"
						}else if(data.forSale == 2){
							html +="<option value='0'>银元宝</option>"
							html +="<option value='1'>金元宝</option>"
							html +="<option value='2' selected>通用</option>"
						}else {
							html +="<option value='0' selected>银元宝</option>"
								html +="<option value='1'>金元宝</option>"
								html +="<option value='2'>通用</option>"
						}
						html+="</select>";
						html+='</div></div>';
						
						
						html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" lay-submit style="margin-left: 109px;" id="saveFormBtn" data-id="' + data.id + '" lay-filter="editForm">保存</a></div>'
						html += '</div>';
						layer.open({
							title: false,
							area: ["500px","95%"],
							type: 1,
							shadeClose:true,
							content: html,
							success: function() {
								console.log(data.type)
								$("#type option[value='"+data.type+"']").attr("selected", true);								
								form.render('select');
							}
						});
				  }
			});
			
			form.on('submit(editForm)', function(data){
				u(data.field);
				return false;
			});
			var pageNum = 1;
			function u(obj) {
				 $.post(path+"/sys/wd/goods/updateStoreGoods",obj,function(d){
					  if(d.status == 200) {
						  layer.msg("修改成功");
						  params.options.page.curr = pageNum
						  table.render(params.options);
					  }else {
						  layer.msg(d.retmsg);
					  }
					  layer.close();
				  })
			}
			
			$("#add").click(function(){
				  var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="editForm2">';
					html += '<div class="layui-form-item"> <label class="layui-form-label">名字</label> <div class="layui-input-block"> <input type="text" name="name" class="layui-input" lay-verify="required"></div></div>';
					html += '<div class="layui-form-item"> <label class="layui-form-label">元宝</label> <div class="layui-input-block"> <input type="number" name="coin" class="layui-input" lay-verify="required"> </div></div>';
					html += '<div class="layui-form-item"> <label class="layui-form-label">条形码</label> <div class="layui-input-block"> <input type="text" name="barcode" class="layui-input"  lay-verify="required"> </div></div>';
					html += '<div class="layui-form-item"> <label class="layui-form-label">位置</label> <div class="layui-input-block"> <input type="number" name="rpos" class="layui-input" lay-verify="required"> </div></div>';
					html += '<div class="layui-form-item"> <label class="layui-form-label">会员购买</label> <div class="layui-input-block">';
					html += "<select name='mustVip' lay-verify='required'>";
					html +="<option value='0'>否</option>"
					html +="<option value='1'>是</option>"
					html+="</select>";
					html+='</div></div>';
					
					
					html += '<div class="layui-form-item" style="width:400px"> <label class="layui-form-label">类型</label> <div class="layui-input-block">';
					html += "<select name='type' id='type' lay-verify='required'>";
					html +="<option value='1'>推荐商品</option>"
					html +="<option value='2'>提升道具</option>"
					html +="<option value='3'>练功道具</option>"
					html +="<option value='4'>其他道具</option>"
					html+="</select>";
					html+='</div></div>';
					
					//是否推荐
					html += '<div class="layui-form-item"> <label class="layui-form-label">是否推荐</label> <div class="layui-input-block">';
					html += "<select name='recommend' lay-verify='required'>";
					html +="<option value='0'>否</option>"
					html +="<option value='3'>是</option>"
					html+="</select>";
					html+='</div></div>';
					
					//元宝类型
					html += '<div class="layui-form-item"> <label class="layui-form-label">元宝类型</label> <div class="layui-input-block">';
					html += "<select name='forSale' lay-verify='required'>";
					html +="<option value='2'>通用</option>"
					html +="<option value='1'>金元宝</option>"
					html +="<option value='0'>银元宝</option>"
					html+="</select>";
					html+='</div></div>';
					
					
					html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" lay-submit style="margin-left: 109px;"  lay-filter="editForm2">保存</a></div>'
					html += '</div>';
					layer.open({
						title: false,
						area: ["500px","95%"],
						type: 1,
						shadeClose:true,
						content: html,
						success: function() {
							form.render('select');
						}
					});
			})
			form.on('submit(editForm2)', function(data){
				var load = $.load();
				$.post(path+"/sys/wd/goods/addStoreGoods",data.field,function(d){
					if(d.status == 200) {
						layer.msg("添加成功");
						table.render(params.options)
					}else {
						layer.msg(d.retmsg);
					}
					layer.close(load);
				})
				return false;
			});
			$("#refreshCache").click(function(){
				$.post(path+"/sys/wd/goods/refreshCacheStoreGoods",function(data){
					layer.msg(data.retmsg);
				})
			})
		});
	</script>
</body>

</html>
