<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>黑名单</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> 
	<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
<link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">
     <style>
    	.openMaxImg:hover{
   		    box-shadow: 0px 0px 4px 1px #4e4e4e;
   		    cursor: pointer;
    	}
    	/* 偶数行背景色 */
		.layui-table[lay-even] tr:nth-child(even) {
		    /* background-color: #aaffaa; */
		    background-color: #eeffee;
		}
		
		/* 鼠标指向表格时,奇数行背景颜色 */
		.layui-table tbody tr:hover,.layui-table-hover {
		    background-color: #eeffee;
		}
		/* 表格头部工具栏背景色 */
		.layui-table-tool {
		    background-color: #eeffee;
		}
		.news_search{
			font-size:14px;
		}
		.layui-form-label{
			padding: 9px 0;
		    left: 18px;
		    color: black;
		    font-size: 15px;
		    top: 1px;
	        width: 35px;
		}
		.layui-form-select {
		    max-width: 8.5rem;
		}
		input::-webkit-outer-spin-button,
	    input::-webkit-inner-spin-button {
	        -webkit-appearance: none;
	    }
	    input[type="number"]{
	        -moz-appearance: textfield;
	    }
    </style>
</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<div class="example">
					
						<blockquote class="layui-elem-quote">
						
							<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="数据"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
						<div class="layui-inline">
							<button type="button" class="layui-btn" id="add">
							  <i class="layui-icon">&#xe608;</i> 添加
							</button>
						</div>
						</blockquote>
						<table id="table" lay-filter="test">
							
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

			<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		layui.use(['layer','table','form', 'laydate','util'], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	var date = layui.laydate;
		  	form = layui.form;
		  	var cols =  [
				{
					title: 'id',
					field: 'id',
					width:"10%"
				}, 
				{
					title: '数据',
					field: 'data',
					width:"50%"
				}, 
				{
					title: '创建时间',
					field: 'addTime',
					width:"30%",
					templet: function(value) {
						if(value.addTime != undefined){
							return util.toDateString(value.addTime,"yyyy-MM-dd HH:mm:ss");
						}else {
							return "";
						}
					}
				},
				{
					title: '操作',
					width:"10%",
					templet:function(data){
						var html = '<a class="layui-btn layui-btn-danger layui-btn-xs del" data="'+data.id+'">删除</a>';
						return html;
					}
				}, 
				
			];
		  	var pageNum = 1;
		  	params = $.myRendar({"table":table,"elem":"#table","url":path+"/system/getBlackLists","method":"post","cols":cols,toolbar:false,
		  		success:function(res,curr,count){
					pageNum = curr;
		  		}
		  	});
			$(document).on("click","#add",function(e){
				var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="addForm">';
				html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 70px; ">数据</label> <div class="layui-input-block"> <input type="text" name="data" class="layui-input"> </div></div>';
				html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" lay-submit style="margin-left: 109px;" id="addBtn">保存</a></div>'
				html += '</div>';
				layer.open({
					title: false,
					area: ["400px"],
					type: 1,
					shadeClose:true,
					content: html
				});
				
				
			});
			$(document).on("click","#addBtn",function(e){
				var d = form.val("addForm");	
				$.post(path+"/system/addBlackList",d,function(data){
					if(data.status == 200) {
						layer.msg("添加成功");
						table.render(params.options);
					}else{
						layer.msg(data.retmsg);
					}
					
				})
			});
			$(document).on("click",".del",function(e){
				var id = $(this).attr("data")
				$.post(path+"/system/delBlackList",{"id":id},function(data){
					if(data.status == 200) {
						layer.msg("删除成功");
						params.options.page.curr = pageNum
						table.render(params.options);
					}else{
						layer.msg(data.retmsg);
					}
				})
			});
			
			//查询
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.page.curr = pageNum
					params.options.where = {"data":name};
				}else {
					params.options.where = {};
				}
				table.render(params.options);
			})
		});
	</script>
</body>

</html>
