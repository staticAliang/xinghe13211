<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>修改密码</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> 
    <link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
    <link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
	<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
    <link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
    <link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">

</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<div>
			<div class="ibox-content">
                    <form class="form-horizontal m-t" id="form">
                    	<div class="form-group">
                            <label class="col-sm-3 control-label">原密码：</label>
                            <div class="col-sm-8">
                                <input name="password" class="form-control" type="password" id="password">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">新密码：</label>
                            <div class="col-sm-8">
                                <input id="newPassword" name="newPassword" class="form-control" type="password">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">确认密码：</label>
                            <div class="col-sm-8">
                                <input id="confirm_password" name="confirm_password" class="form-control" type="password">
                                <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 请再次输入您的密码</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button class="btn btn-primary" type="submit">提交</button>
                                <button class="btn btn-primary" type="reset" id="reset" style="display:none">重置</button>
                            </div>
                        </div>
                    </form>
             </div>
		
		</div>
	</div>
	<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/plugins/validate/jquery.validate.min.js}"></script>
	<script th:src="@{/static/sys/js/plugins/validate/messages_zh.min.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script type="text/javascript" th:line="javascript">
	var path = '[[${session.path}]]';
		$(function(){
			
			$("#form").validate({
				rules: {
					password: {
						required: true
					},
					newPassword: {
						required: true
					},
					confirm_password: {
						required: true,
						equalTo:"#newPassword"
					}
				},
				messages: {
					password: {
						required: "请输入密码"
					},
					newPassword: {
						required: "请输入新密码"
					},
					confirm_password: {
						required: "再次输入密码",
						equalTo:"两次密码不一致"
					}
				},
				submitHandler:function(form){
					$.post(path+"/sys/user/changePassword",{"password":$("#password").val(), "newPassword":$("#newPassword").val()},function(data){
						if(data.status == 200) {
							swal({
								title: "已修改密码",
								timer: 1000,
								showConfirmButton: false,
								type: "success"
							});
							$("#reset").click();
							$("#password").focus();
							//退出登录
							window.location.href = path+"/sys/user/logout?v=3.0";
						} else {
							swal({
								title: data.retmsg,
								timer: 1000,
								showConfirmButton: false,
								type: "error"
							});
						}
					})
				}
			})
		})
	</script>
</body>

</html>
