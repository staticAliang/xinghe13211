<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>活动轨迹</title>
<meta name="keywords" content="">
<meta name="description" content="">

<link rel="shortcut icon" href="favicon.ico">
<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
<link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">
<style>
.openMaxImg:hover {
	box-shadow: 0px 0px 4px 1px #4e4e4e;
	cursor: pointer;
}


/* 鼠标指向表格时,奇数行背景颜色 */
.layui-table tbody tr:hover, .layui-table-hover {
	background-color: #eeffee;
}
/* 表格头部工具栏背景色 */
.layui-table-tool {
	background-color: #eeffee;
}
.news_search {
	font-size: 14px;
}

.layui-form-label {
	padding: 9px 0;
	left: 18px;
	color: black;
	font-size: 15px;
	top: 1px;
	width: 70px;
}

input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
	-webkit-appearance: none;
}

input[type="number"] {
	-moz-appearance: textfield;
}
</style>
</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg layui-form" lay-filter="choujiang">
				<div class="col-sm-12">
					<blockquote class="layui-elem-quote news_search">
						<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="角色"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="请输入来源"
									class="layui-input" type-close autocomplete="off" name="source">
							</div>
						</div>
						<div class="layui-inline" style="width:100px" lay-filter="remarks">
							<select name='level'>;
								<option value='-1' selected="selected">选择备注</option>
								<option value='经验'>经验</option>
								<option value='道行'>道行</option>
								<option value='宠物'>宠物</option>
								<option value='充值积分'>积分</option>
								<option value='法宝'>法宝</option>
							</select>
						</div>
						<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text"
									class="layui-input" autocomplete="off" name="time" readonly="readonly" id="time">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
					</blockquote>
					<!-- Example Events -->
					<div class="example">
						<table id="table" lay-filter="test">

						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

		<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
	<script th:line="javascript">
	var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		layui.use([ 'layer', 'table', 'form', 'laydate', 'util' ], function() {
			util = layui.util;
			layer = layui.layer;
			table = layui.table;
			var date = layui.laydate;
			form = layui.form;
			var cols = [ {
				title : 'id',
				field : 'id',
			}, 
			{
				title : '角色',
				field : 'charaName',
			},
			{
				title : '数据',
				field : 'data'
			},
			{
				title : '备注',
				field : 'remarks',
			}, {
				title : '来源',
				field : 'source',
			}
			,{
				title: '创建时间',
				templet: function(value) {
					if(value.addTime != undefined){
						return util.timeAgo(value.addTime);
					}else {
						return "";
					}
				}
			}
			];
			date.render({
				elem: '#time',
				format: "yyyy-MM-dd",
				range: "~"
			});
			params = $.myRendar({
				"table" : table,
				"elem" : "#table",
				"url" : path+"/wd/sys/dailyStats/getDailyStats",
				"method" : "post",
				pageLayout:{ prev : "上一页",next : "下一页",layout: ['prev', 'next']},
				"cols" : cols,
				toolbar : false,
				success:function(c,curr) {
					pageNum = curr;
				}
			});
			
			$("#query").click(function(data){
				var name = $(".search_btn").val();
				var source = $("input[name='source']").val();
				var choujiang = form.val("choujiang");
				var time = $("#time").val();
				var data = {};
				if(name.trim() != "" && name.length > 0) {
					data.charaName = name;
				}
				if(source.trim() != "" && source.length > 0) {
					data.source = source;
				}
				if(choujiang.level != "-1") {
					data.remarks = choujiang.level;
				}
				if(time.trim() != "" && time.length > 0) {
					data.time = time;
				}
				params.options.where = data;
				table.render(params.options);
			})
			table.on('tool(test)', function(obj){
				  var data = obj.data;
				  var layEvent = obj.event;
				  var t = $(this);
				  var obj = {};
			});
			
			
			var pageNum = 1;
			
			form.on('select(level)', function(data){
				var obj = {};
				if(data.value != "-1") {
					obj.level = data.value;
				}
				params.options.where = obj;
				table.render(params.options);
			});
		});
	</script>
</body>

</html>
