<!DOCTYPE html>
<html>

<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>试道基础gu</title>
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport"
	content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
<link rel="stylesheet"
	href="/static/sys/layui-v2.5.6/layui/css/layui.css" media="all">
<link rel="stylesheet" href="/static/sys/css/admin.css" media="all">
<style type="text/css">
.whLoad {
	background:
		url('/static/sys/layui-v2.5.6/layui/css/modules/layer/default/loading-1.gif');
	background-repeat: no-repeat;
	background-position: center center;
}

.weatherShadow {
	position: absolute;
	height: 100%;
	background: #ff000000;
	width: 100%;
	margin-top: -24px;
}

/* 鼠标指向表格时,奇数行背景颜色 */
.layui-table tbody tr:hover, .layui-table-hover {
	background-color: #eeffee;
}
/* 表格头部工具栏背景色 */
.layui-table-tool {
	background-color: #eeffee;
}
/* 表格头部背景色 */
th {
	background-color: #359f6a;
	/* MediumSeaGreen */
	color: #fff;
	font-weight: bold
}

.baseSettings {
	height: 50px;
	background: #f5f3f3;
}

.b-title {
	background: red;
	font-size: 14px;
}

#comment {
	width: 100%;
	height: 243px;
	resize: none;
	font-size: 20px;
	border: 0;
	border-radius: 5px;
	background-color: rgba(245, 245, 245, 0.98);
	padding: 10px;
	margin-left: -10px;
}

#comment:hover {
	box-shadow: 0px 1px 2px 2px #efeee5;
}
/* 大于等于991px */
@media screen and (min-width: 991px) {
	#newCharaSet {
		
	}
}

input[type='number']::-webkit-outer-spin-button, input[type='number']::-webkit-inner-spin-button
	{
	-webkit-appearance: none !important;
	margin: 0;
}

.carColor {
	background: #e4e4e4
}
</style>
</head>

<body>
	<div class="layui-fluid">
		<div class="layui-row layui-col-space15">
			<div class="layui-col-md12">
				<div class="layui-row layui-col-space15">
					<div class="layui-col-md12">
						<div class="layui-card" style="min-height: 740px;">
							<div class="layui-tab layui-tab-brief">
								<ul class="layui-tab-title">
									<li class="layui-this">基础设置</li>
									<li>挑战次数</li>
									<li>装备改造</li>
									<li>历史数据</li>
								</ul>
								<div class="layui-tab-content">
									<!-- 试道配置 开始 -->
									<div class="layui-tab-item layui-show">
									</div>
									<!-- 试道配置 结束 -->


									<!-- 历史数据 -->
									<div class="layui-tab-item layui-form">敬请期待</div>
									<!-- 历史数据 -->
								</div>
							</div>
						</div>

					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- gm配置开关 -->
</body>
<script src="/static/sys/js/jquery.min.js?v=2.1.4"></script>
<script src="/static/sys/layui-v2.5.6/layui/layui.js"></script>
<script src="/static/sys/js/layer.table.exapnd.js"></script>
<script src="/static/sys/js/public.js"></script>

<script th:line="javascript">
	layui.use([ "form", "layer" ], function() {
		var layer = layui.layer;
		var form = layui.form;
		var config;
		loadConfig();
		function loadConfig() {
			//加载配置操作信息
			$.post("/sys/wd/getConfig", function(data) {
				config = data.data;
				var base = config.baseConfig;
				//设置信息
				form.val("baseForm", {
					"chongzhibili" : base.chongzhibili,
					"flyXianMo" : base.flyXianMo,
					"realMaxLevel" : base.realMaxLevel,
					"upgradeMaxLevel" : base.upgradeMaxLevel,
					"chargeLink" : base.chargeLink,
					"manageLink" : base.manageLink,
					"zmcs" : base.zmcs,
					"gzcgv" : base.gzcgv,
					"qhcgjv" : base.qhcgjv,
					"chubaoNum" : base.chubaoNum,
					"shimenNum" : base.shimenNum,
					"baibangmangNum" : base.baibangmangNum,
					"xiuxingcishuNum" : base.xiuxingcishuNum,
					"xiuxingDuiwuNum" : base.xiuxingDuiwuNum,
					"tongtiantaNum" : base.tongtiantaNum,
					"baxianNum" : base.baxianNum,
					"zhanshenNum" : base.zhanshenNum,
					"bossNum" : base.bossNum,
					"tiandixingNum" : base.tiandixingNum,
					"zhengdaodianNum" : base.zhengdaodianNum,
					"yingxionghuiNum" : base.yingxionghuiNum,
					"ditushouhuNum" : base.ditushouhuNum,
					"shangguNum" : base.shangguNum,
					"wannianNum" : base.wannianNum
				});
			})
		}
		//监听设置输入框改变.
		$(".baseSet").blur(function() {
			var t = $(this);
			//请求后端修改
			var val = form.val("baseForm");
			$.post("/sys/wd/setBaseConfig", val, function(data) {
				if (data.status == 200) {
					layer.msg("修改成功");
				} else {
					layer.msg(data.retmsg);
				}
			})
		})

	})
</script>

</html>
