<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>攻城BOSS配置</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> 
    <link rel="stylesheet" th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" />
    <style type="text/css">
    	input::-webkit-outer-spin-button,
	    input::-webkit-inner-spin-button {
	        -webkit-appearance: none;
	    }
	    input[type="number"]{
	        -moz-appearance: textfield;
	    }
    </style>
</head>

<body>
	<div class="layui-form" style="width: 90%; margin-top: 31px;"
		lay-filter="showForm">
  		<div class="layui-form-item">
		    <label class="layui-form-label">刷新个数</label>
		    <div class="layui-input-block">
		    	<input type="number" name="count" class="layui-input">
		    </div>
  		</div>
  		<div class="layui-form-item">
		    <label class="layui-form-label">刷新时间(分)</label>
		    <div class="layui-input-block">
		    	<input type="number" name="time" class="layui-input">
		    	<input type="hidden" name="aliasName" class="layui-input">
		    	<input type="hidden" name="uuid" class="layui-input">
		    </div>
  		</div>
		
		<div class="layui-form-item">
			<a class="layui-btn layui-btn-danger layui-btn" style="margin-left: 109px;" id="save">保存</a>
		</div>
		</div>
		<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
		<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
		<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
		<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		layui.use(['layer','table','form','util', "laydate"], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	form = layui.form;
		  	var laydate = layui.laydate;
		  	//加载信息
		  	$.post(path+"/ws/configInfo/getOneConfigInfoData",{"keyName":"gongcheng_boss_config"},function(data){
		  		if(data.status == 200) {
		  			var config = data.data;
		  			var configJson = JSON.parse(config.data);
		  			form.val("showForm",{
		  				"count":configJson.count,
		  				"time":configJson.time,
		  				"aliasName":data.data.aliasName,
		  				"uuid":data.data.uuid,
		  			})
		  		}
		  	})
		  	$(document).keydown(function(e) {
			    var key = undefined;
			    var possible = [ e.key, e.keyIdentifier, e.keyCode, e.which ];
			    while (key === undefined && possible.length > 0) {
			        key = possible.pop();
			    }
			    if (key && (key == '115' || key == '83' ) && (e.ctrlKey || e.metaKey) && !(e.altKey)){
			        e.preventDefault();
			        save();
			        return false;
			    }
			    return true;
			}); 
			$(document).on("click","#save",function(){
				save();
		  	})
		  	function save(){
				var da = form.val("showForm");
				var dataObj = {"count":da.count,"time":da.time};
		  		var load = $.load("正在保存...");
	  			$.post(path+"/ws/configInfo/updateConfigInfoByUUID2",{"uuid":"GONGCHENG_BOSS","data":JSON.stringify(dataObj),"aliasName":da.aliasName},function(data){
	  				if(data.status == 200) {
	  					layer.msg("修改成功");
	  				}
	  				layer.close(load);
	  			})
			}
		});
	</script>
</body>

</html>
