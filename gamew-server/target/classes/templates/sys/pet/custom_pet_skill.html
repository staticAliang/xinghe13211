<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>自定义宠物技能</title>
<meta name="keywords" content="">
<meta name="description" content="">

<link rel="shortcut icon" href="favicon.ico">
<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">
<link th:href="@{/static/sys/css/plugins/sweetalert/sweetalert.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">
<link th:href="@{/static/sys/css/animate.min.css}" rel="stylesheet">
<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">
<style>

/* 表格头部工具栏背景色 */
.layui-table-tool {
	background-color: #eeffee;
}

.news_search {
	font-size: 14px;
}

.layui-form-label {
	padding: 9px 0;
	left: 18px;
	color: black;
	font-size: 15px;
	top: 1px;
	width: 35px;
}

.layui-form-select {
	max-width: 8.5rem;
}

input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
	-webkit-appearance: none;
}

input[type="number"] {
	-moz-appearance: textfield;
}
</style>
</head>

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<blockquote class="layui-elem-quote news_search">
						<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="名字"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
						<div class="layui-inline">
							 <a class="layui-btn search_btn_cl add">添加</a>
						</div>
						<div class="layui-inline">
							<a class="layui-btn layui-btn-danger" id="refreshCache">刷新缓存</a>
						</div>
					</blockquote>


					<!-- Example Events -->
					<div class="example">
						<table id="table" lay-filter="test">

						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

		<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
	<script th:line="javascript">
	var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		
		layui.use([ 'layer', 'table', 'form', 'laydate', 'util' ], function() {
			util = layui.util;
			layer = layui.layer;
			table = layui.table;
			var date = layui.laydate;
			form = layui.form;
			var cols = [ {
				title : 'id',
				field : 'id'
			}, {
				title : '宠物名',
				field : 'petName',
				edit : "text"
			}, {
				title : '技能名',
				field : 'skillName',
				edit : "text"
			}, 
			 {
				title : '技能等级',
				field : 'skillLevel',
				edit : "text"
			},
			{
				title : '目标数',
				field : 'skillRange',
				edit : "text"
			}, 
			{
				title : '回合数',
				field : 'skillRound',
				edit : "text"
			},
			{
				title: '创建时间',
				templet: function(value) {
					if(value.addTime != undefined){
						return util.toDateString(value.addTime,"yyyy-MM-dd");
					}else {
						return "";
					}
				}
			}
			];
			params = $.myRendar({
				"table" : table,
				"elem" : "#table",
				"url" : path+"/sys/wd/customPetSkill/getCustomPetSkillByPetName",
				"method" : "post",
				"cols" : cols,
				toolbar : false,
				templet:function(data){
					var html = "";
					html+='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del" data-id="'+data.id+'" >删除</a>';
					return html;
				}
			});
			
			
			$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"petName":name};
				}else {
					params.options.where = {};
				}
				table.render(params.options);
			})
			
			table.on('edit(test)', function(obj){
				  var data = {"id":obj.data.id};
				  data[obj.field] = obj.value;
				  
				  if(obj.field == "skillRound" || obj.field == "skillRange" || obj.field == "skillLevel"){
					  if(!isNum(obj.value)) {
						  layer.msg("请输入数字.");
						  return false;
					  }
			 	  }
				  var load = $.load();
				  $.post(path+"/sys/wd/customPetSkill/updateCustomPetSkillById",data,function(d){
					  if(d.status == 200) {
						  layer.msg("修改成功");
						  table.render(params.options);
					  }else {
						  layer.msg(d.retmsg);
					  }
					  layer.close(load);
				  })
				  
			});
			
			table.on('tool(test)', function(obj){
				  var data = obj.data;
				  var layEvent = obj.event;
				  var t = $(this);
				  if(layEvent == "del") {
					  layer.confirm("确定删除吗?",function(){
						  $.post(path+"/sys/wd/customPetSkill/deleteById",{"id":data.id},function(d){
							  if(d.status == 200) {
								  layer.msg("删除成功");
								  obj.del();
							  }else {
								  layer.msg(d.retmsg);
							  }
						  })
					  })
				  }
			});
			$("#refreshCache").click(function(){
				$.post(path+"/sys/wd/customPetSkill/refreshCache",function(data){
					layer.msg(data.retmsg);
				})
			})
			
			$(".add").click(function(){
				var html = '<div class="layui-form" style="width:90%;margin-top:31px;" lay-filter="addForm">';
				html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 60px; ">宠物名</label> <div class="layui-input-block"> <input type="text" name="petName" class="layui-input" lay-verify="required"> </div></div>';
				html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 60px; ">技能名</label> <div class="layui-input-block"> <input type="text" name="skillName" class="layui-input" lay-verify="required"> </div><div class="layui-form-mid layui-word-aux" style=" margin-left:112px; ">障碍技能不支持,辅助技能只支持一阶技能,法攻技能最多三个,并且会覆盖之前的。</div></div>';
				html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 60px; ">技能等级</label> <div class="layui-input-block"> <input type="number" name="skillLevel" class="layui-input" lay-verify="required" value="1"> </div></div>';
				html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 60px; ">目标数</label> <div class="layui-input-block"> <input type="number" name="skillRange" class="layui-input" lay-verify="required" value="1"> </div></div>';
				html += '<div class="layui-form-item"> <label class="layui-form-label" style=" width: 60px; ">回合数</label> <div class="layui-input-block"> <input type="number" name="skillRound" class="layui-input" lay-verify="required" value="1"> </div></div>';
				html += '<div class="layui-form-item"><a class="layui-btn layui-btn-danger layui-btn" style="margin-left: 109px;" id="addSubmit">保存</a></div>'
				html += '</div>';
				layer.open({
					title: false,
					area: ["500px"],
					type: 1,
					content: html,
					success: function() {
					}
				});
			})
			$(document).on("click","#addSubmit",function(){
				var load = $.load("正在添加");
				var d = form.val("addForm");
				$.post(path+"/sys/wd/customPetSkill/addCustomPetSkill",d,function(d){
					  if(d.status == 200) {
						  layer.msg("添加成功");
						  table.render(params.options);
					  }else {
						  layer.msg(d.retmsg);
					  }
					  layer.close(load);
			  	})
			})
		});
	</script>
</body>

</html>
