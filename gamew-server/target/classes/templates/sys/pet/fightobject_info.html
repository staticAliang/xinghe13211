<head>

	<link th:href="@{/static/sys/css/bootstrap.min.css?v=3.3.5}" rel="stylesheet">

	<link th:href="@{/static/sys/css/font-awesome.min.css?v=4.4.0}" rel="stylesheet">

	<link th:href="@{/static/sys/css/style.min.css?v=4.0.0}" rel="stylesheet">
	<link th:href="@{/static/sys/layui-v2.5.6/layui/css/layui.css}" rel="stylesheet" />
	<link rel="stylesheet" th:href="@{/static/sys/css/global.css}">
     <style>
    	.openMaxImg:hover{
   		    box-shadow: 0px 0px 4px 1px #4e4e4e;
   		    cursor: pointer;
    	}
		/* 表格头部工具栏背景色 */
		.layui-table-tool {
		    background-color: #eeffee;
		}
		.news_search{
			font-size:14px;
		}
		.layui-form-label{
			padding: 9px 0;
		    left: 18px;
		    color: black;
		    font-size: 15px;
		    top: 1px;
	        width: 35px;
		}

		    max-width: 8.5rem;
		}
		input::-webkit-outer-spin-button,
	    input::-webkit-inner-spin-button {
	        -webkit-appearance: none;

	    input[type="number"]{
	        -moz-appearance: textfield;

<body>
	<div class="wrapper wrapper-content animated fadeInRight">
		<!-- Panel Other -->
		<div class="ibox float-e-margins">
			<div class="row row-lg">
				<div class="col-sm-12">
					<!-- Example Events -->
					<blockquote class="layui-elem-quote news_search">
						<div class="layui-inline">
							<div class="layui-input-inline">
								<input type="text" placeholder="名字"
									class="layui-input search_btn" type-close autocomplete="off">
							</div>
						</div>
						<div class="layui-inline">
							<a class="layui-btn" id="query">查询</a>
						</div>
						<div class="layui-inline">
							<a class="layui-btn layui-btn-danger" id="refreshCache">刷新缓存</a>
						</div>
					</blockquote>
					<div class="example">
						<table id="table" lay-filter="test">
							
						</table>
					</div>
					<!-- End Example Events -->
				</div>
			</div>
		</div>
		<!-- End Panel Other -->
	</div>

			<script th:src="@{/static/sys/js/jquery.min.js?v=2.1.4}"></script>
	<script th:src="@{/static/sys/js/bootstrap.min.js?v=3.3.5}"></script>
	<script th:src="@{/static/sys/js/content.min.js}"></script>
	<script th:src="@{/static/sys/layui-v2.5.6/layui/layui.js}"></script>
	<script th:src="@{/static/sys/js/plugins/sweetalert/sweetalert.min.js}"></script>
	<script th:src="@{/static/sys/js/layer.table.exapnd.js}"></script>
	<script th:src="@{/static/sys/js/public.js}"></script>
		<script th:line="javascript">
		var path = '[[${session.path}]]';
		var layer;
		var table;
		var params;
		var util;
		layui.use(['layer','table','form', 'laydate','util'], function(){
			util = layui.util;
		  	layer = layui.layer;
		  	table = layui.table;
		  	var date = layui.laydate;
		  	form = layui.form;
		  	var cols =  [
				{
					title: 'id',
					field: 'id',
					width:150
				}, 
				{
					title: '别名',
					field: 'name',
					edit:"text",
					width:150
				},
				{
					title: '名字',
					field: 'showName',
					edit:"text",
					width:150
				},
				{
					title: '类型',
					field: 'type',
					width:150
				},
				{
					title: '血量',
					field: 'life',
					edit:"text",
					width:100
				},
				{
					title: '法力',
					field: 'mana',
					edit:"text",
					width:100
				},
				{
					title: '速度',
					field: 'speed',
					edit:"text",
					width:100
				},
				
				{
					title: '物伤',
					field: 'phyAttack',
					edit:"text",
					width:100
				},
				{
					title: '法伤',
					field: 'magAttack',
					edit:"text",
					width:100
				},
				{
					title: '相性',
					field: 'polar',
					edit:"text",
					width:100
				},
				{
					title: '技能',
					field: 'skill',
					edit:"text",
					width:100
				},
				{
					title: '道行',
					field: 'daohang',
					edit:"text",
					width:100
				},
				{
					title: '防御',
					field: 'def',
					edit:"text",
					width:100
				},
				{
					title: '所有抗性',
					field: 'allResistPolar',
					edit:"text",
					width:100
				},
				{
					title: '抗金',
					field: 'resistMetal',
					edit:"text",
					width:100
				},
				{
					title: '抗木',
					field: 'resistWood',
					edit:"text",
					width:100
				},
				{
					title: '抗水',
					field: 'resistWater',
					edit:"text",
					width:100
				},
				{
					title: '抗火',
					field: 'resistFire',
					edit:"text",
					width:100
				},
				{
					title: '抗土',
					field: 'resistEarth',
					edit:"text",
					width:100
				},
				{
					title: '连击率',
					field: 'doubleHitRate',
					edit:"text",
					width:100
				},
				{
					title: '连击数',
					field: 'doubleHit',
					edit:"text",
					width:100
				},
				{
					title: '法术必杀',
					field: 'mstuntRate',
					edit:"text",
					width:100
				},
				{
					title: '状态',
					field: 'deleted',
					templet: function(value) {
						if(value.deleted){
							return "已删除";
						}else {
							return "正常";
						}
					},
					width:80
				}
			];
		  	params = $.myRendar({"table":table,"elem":"#table","url":path+"/sys/wd/pet/getTpets","method":"post","cols":cols,toolbar:false,
				templet:function(data){
					var html = "";
					if(!data.deleted) {
						html+='<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del" data-id="'+data.id+'" >删除</a>';
					}else {
						html+='<a class="layui-btn layui-btn-wring layui-btn-xs" lay-event="cancel" data-id="'+data.id+'">恢复</a>';
					}
					return html;
				},width:100});
		
		  	$("#query").click(function(data){
				var name = $(".search_btn").val();
				if(name.trim() != "" && name.length > 0) {
					params.options.where = {"name":name};
				}else {
					params.options.where = {};
				}
				table.render(params.options);
			})
			
			table.on('edit(test)', function(obj){
				  var data = {"id":obj.data.id};
				  data[obj.field] = obj.value;
				  if(obj.field == "life" || obj.field == "mana" || obj.field == "speed" 
						  || obj.field == "phyAttack" || obj.field == "magAttack" || obj.field == "polar" || obj.field == "daohang"
							  || obj.field == "def"){
					  if(!isNum(obj.value)) {
						  layer.msg("请输入数字.");
						  return false;
					  }
				  }
				  var load = $.load();
				  $.post(path+"/sys/wd/pet/updateTpet",data,function(d){
					  if(d.status == 200) {
						  layer.msg("修改成功");
					  }else {
						  layer.msg(d.retmsg);
					  }
					  layer.close(load);
				  })
				  
			});
			
			table.on('tool(test)', function(obj){
				  var data = obj.data;
				  var layEvent = obj.event;
				  var t = $(this);
				  var obj = {};
				  if(layEvent == "del") {
					  layer.confirm("确定删除吗?",function(){
						  obj.id = data.id;
						  obj.deleted = true;
						  u(obj)
					  })
					  
				  }else if(layEvent == "cancel") {
					  
					  layer.confirm("确定恢复?",function(){
						  obj.mapId = data.MapId;
						  obj.id = data.id;
						  obj.deleted = false;
						  u(obj)
					  })
				  }
			});
			
			function u(obj) {
				 $.post(path+"/sys/wd/pet/updateTpet",obj,function(d){
					  if(d.status == 200) {
						  layer.msg("修改成功");
						  table.render(params.options);
						 
					  }else {
						  layer.msg(d.retmsg);
					  }
					  layer.closeAll();
				  })
			}
			
			$("#refreshCache").click(function(){
				$.post(path+"/sys/wd/pet/refreshCacheTpet",function(data){
					layer.msg(data.retmsg);
				})
			})
		});
	</script>
</body>

</html>
